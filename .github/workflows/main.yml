          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          data class TimestampDubSegment(
              val startMs: Long,
              val endMs: Long,
              val originalText: String,
              val translatedText: String,
              var isTriggered: Boolean = false
          )

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var videoView: VideoView
              private lateinit var statusText: TextView
              private lateinit var subtitleOverlay: TextView
              private lateinit var errorBox: TextView
              private lateinit var centerStartBtn: Button
              private lateinit var playPauseBtn: Button
              
              private lateinit var langBtn: Button
              private lateinit var voiceBtn: Button
              private lateinit var styleBtn: Button
              private lateinit var speedBtn: Button

              private var selectedVideoUri: Uri? = null
              private var tts: TextToSpeech? = null
              private var mediaPlayerRef: MediaPlayer? = null
              private val uiHandler = Handler(Looper.getMainLooper())

              private val isProcessing = AtomicBoolean(false)
              private val isSeeking = AtomicBoolean(false)
              private val seekTargetMs = AtomicLong(-1L)

              private var activeLockedModel: String? = null
              private val candidateModels = mutableListOf<String>()

              // Session Cache & Timeline Queue
              private val timelineDubQueue = ConcurrentLinkedQueue<TimestampDubSegment>()
              private val sessionCacheMap = ConcurrentHashMap<Long, TimestampDubSegment>()
              private var currentlyPlayingSegment: TimestampDubSegment? = null

              // Pacing & Breathing Gap Controllers
