                  targetLangName = prefs.getString("LANG_NAME", "Hindi") ?: "Hindi"
                  voiceTypeIndex = prefs.getInt("VOICE_INDEX", 0)
                  dubStyleKey = prefs.getString("DUB_STYLE", "emotional") ?: "emotional"
