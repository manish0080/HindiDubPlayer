                              .setNegativeButton("Start from beginning") { _, _ ->
                                  videoView.seekTo(1)
                                  statusText.text = "Video loaded. Tap START."
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                              .setCancelable(false)
                              .show()
                      } else {
                          videoView.seekTo(1)
                          statusText.text = "Video ready! Tap 'START LIVE DUBBING'."
                          centerStartBtn.visibility = View.VISIBLE
                      }
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  processedSegments = 0
                  statusText.text = "⏳ Buffering audio (Starting in 1-2 sec)..."

                  Thread {
                      startLiveStreamingPipeline(uri)
                  }.start()
              }

              private fun startLiveStreamingPipeline(uri: Uri) {
                  val extractor = MediaExtractor()
                  try {
                      pfd?.close()
                      pfd = contentResolver.openFileDescriptor(uri, "r")
                      val descriptor = pfd?.fileDescriptor
                      if (descriptor == null) {
                          showError("Cannot access video file stream")
                          return
                      }

                      extractor.setDataSource(descriptor)

                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }

                      if (audioTrackIndex < 0 || audioFormat == null) {
                          showError("No audio track detected in video!")
                          extractor.release()
                          return
                      }

                      extractor.selectTrack(audioTrackIndex)

                      var chunkIndex = 0
                      var hasMoreAudio = true
                      val buffer = ByteBuffer.allocate(1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()

                      while (hasMoreAudio && isProcessing.get()) {

                          // Fast start: Chunk 0 is only 5s. Subsequent chunks are 10s.
                          val chunkDurationUs = if (chunkIndex == 0) 5_000_000L else 10_000_000L

                          // Instant jump handling
                          val targetSeek = seekTargetUs.getAndSet(-1L)
                          if (targetSeek >= 0) {
                              extractor.seekTo(targetSeek, MediaExtractor.SEEK_TO_CLOSEST_SYNC)
                          }

                          // CRITICAL PACING FIX: Strict sync with actual video playback
                          if (chunkIndex > 0) {
                              // 1. If video is paused by user, wait!
                              while (isProcessing.get() && !videoView.isPlaying && seekTargetUs.get() < 0) {
                                  Thread.sleep(250)
                              }

                              // 2. Wait until video reaches current chunk's timeline so we never rush ahead of video
                              val expectedChunkTimeMs = (if (chunkIndex == 1) 5000L else 5000L + (chunkIndex - 1) * 10000L)
                              while (isProcessing.get() && videoView.isPlaying && seekTargetUs.get() < 0) {
                                  val currentPosMs = videoView.currentPosition
                                  if (currentPosMs >= expectedChunkTimeMs - 2000L) {
                                      break // Ready to process next chunk
                                  }
                                  Thread.sleep(300)
                              }
                          }

                          val currentChunkNum = chunkIndex + 1
                          val chunkFile = File(cacheDir, "chunk_$chunkIndex.m4a")
                          if (chunkFile.exists()) chunkFile.delete()

                          val muxer = MediaMuxer(chunkFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          var chunkStartPts = -1L
                          var lastPts = 0L
                          var samplesWritten = 0

                          while (isProcessing.get()) {
                              if (seekTargetUs.get() >= 0) break

                              buffer.clear()
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) {
                                  hasMoreAudio = false
                                  break
                              }

                              val rawPts = extractor.sampleTime
                              if (chunkStartPts == -1L) chunkStartPts = rawPts

                              var relativePts = rawPts - chunkStartPts
                              if (relativePts <= lastPts) {
                                  relativePts = lastPts + 20_000L
                              }
                              lastPts = relativePts

                              if (relativePts >= chunkDurationUs) {
                                  break
                              }

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = relativePts
                              bufferInfo.flags = extractor.sampleFlags

                              buffer.position(0)
                              buffer.limit(sampleSize)

                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              samplesWritten++
                              extractor.advance()
                          }

                          try {
                              if (samplesWritten > 0) muxer.stop()
                              muxer.release()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }

                          if (seekTargetUs.get() >= 0) {
                              chunkFile.delete()
                              continue
                          }

                          if (chunkFile.exists() && chunkFile.length() > 500) {
                              try {
                                  runOnUiThread {
                                      statusText.text = "Translating part $currentChunkNum..."
                                  }

                                  val recognizedText = transcribeAudioWithRetry(chunkFile, groqApiKey)

                                  if (recognizedText.isNotBlank()) {
                                      val dubbedText = translateWithRetry(recognizedText, targetLangName, dubStyleKey, activeSelectedModel, groqApiKey)

                                      runOnUiThread {
                                          processedSegments++
                                          saveCurrentPosition()

                                          // Auto-start video on chunk 0
                                          if (chunkIndex == 0 && !videoView.isPlaying) {
                                              videoView.seekTo(0)
                                              videoView.start()
                                              statusText.text = "Playing ($targetLangName) ✓\n\n$dubbedText"
                                              speakDubbed(dubbedText, true)
                                          } else {
                                              statusText.text = "Playing (Part $currentChunkNum) ✓\n\n$dubbedText"
                                              speakDubbed(dubbedText, false)
                                          }
                                      }
                                  } else {
                                      // Silence / No speech in this segment
                                      if (chunkIndex == 0 && !videoView.isPlaying) {
                                          runOnUiThread {
                                              videoView.seekTo(0)
                                              videoView.start()
                                              statusText.text = "Playing (Listening for dialogues...)"
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  showError("Part $currentChunkNum: ${e.localizedMessage}")
                                  isProcessing.set(false)
                                  break
                              } finally {
                                  chunkFile.delete()
                              }
                          }

                          chunkIndex++
                      }

                      extractor.release()

                  } catch (e: Exception) {
                      showError("Playback Error: ${e.localizedMessage}")
                      try { extractor.release() } catch (_: Exception) {}
                  }
              }

              private fun showError(msg: String) {
                  lastErrorDetails = msg
                  runOnUiThread {
                      errorBox.text = "⚠️ $msg\n(Tap ⚙️ Menu for details)"
                      errorBox.visibility = View.VISIBLE
                      statusText.text = "Dubbing Paused on Error"
                      centerStartBtn.visibility = View.VISIBLE
                  }
              }

              private fun speakDubbed(text: String, flush: Boolean) {
                  applyVoicePreset()
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  val mode = if (flush) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                  tts?.speak(text, mode, params, "dub_${System.currentTimeMillis()}")
              }

              private fun transcribeAudioWithRetry(audioFile: File, apiKey: String): String {
                  var attempts = 0
                  while (attempts < 3) {
                      try {
                          return transcribeAudio(audioFile, apiKey)
                      } catch (e: Exception) {
                          val msg = e.localizedMessage ?: ""
                          if (msg.contains("429") || msg.contains("rate_limit", ignoreCase = true)) {
                              attempts++
                              Thread.sleep(3000)
                          } else {
                              throw e
                          }
                      }
                  }
                  throw Exception("Audio transcription busy. Retrying...")
              }

              private fun transcribeAudio(audioFile: File, apiKey: String): String {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val lineEnd = "\r\n"
                  val twoHyphens = "--"

                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                      connectTimeout = 12000
                      readTimeout = 20000
                      doOutput = true
                      doInput = true
                  }

                  val out = DataOutputStream(conn.outputStream)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"" + lineEnd + lineEnd)
                  out.writeBytes("whisper-large-v3-turbo" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"" + lineEnd + lineEnd)
                  out.writeBytes("json" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                  out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var bytesRead: Int
                      while (fis.read(buf).also { bytesRead = it } != -1) {
                          out.write(buf, 0, bytesRead)
                      }
                  }

                  out.writeBytes(lineEnd)
                  out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                  out.flush()
                  out.close()

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).optString("text", "").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Whisper: $err")
                  }
              }

              private fun translateWithRetry(text: String, targetLang: String, style: String, model: String, apiKey: String): String {
                  var attempts = 0
                  while (attempts < 3) {
                      try {
                          return translateToLang(text, targetLang, style, model, apiKey)
                      } catch (e: Exception) {
                          val msg = e.localizedMessage ?: ""
                          if (msg.contains("429") || msg.contains("rate_limit", ignoreCase = true)) {
                              attempts++
                              Thread.sleep(3000)
                          } else {
                              throw e
                          }
                      }
                  }
                  throw Exception("Translation server busy. Retrying...")
              }

              private fun translateToLang(sourceText: String, targetLang: String, style: String, modelName: String, apiKey: String): String {
                  val url = URL("https://api.groq.com/openai/v1/chat/completions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "application/json")
                      connectTimeout = 12000
                      readTimeout = 20000
                      doOutput = true
                      doInput = true
                  }

                  val systemPrompt = if (style == "emotional") {
                      "You are a professional anime, comic and movie voice dubber. Translate the dialogue into natural, highly expressive spoken $targetLang with human emotion. Use natural conversational phrases, pauses (...) and commas (,) naturally. Keep sentences tight and punchy. Output ONLY the translated text in the script of $targetLang. No notes or explanations."
                  } else {
                      "You are a textbook translator. Translate the dialogue into formal, grammatically strict, and literal $targetLang. Keep sentences concise. Output ONLY the translated text in the script of $targetLang. No notes or extra text."
                  }

                  val payload = JSONObject().apply {
                      put("model", modelName)
                      val messages = JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put("content", systemPrompt)
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", sourceText)
                          })
                      }
                      put("messages", messages)
                      put("temperature", if (style == "emotional") 0.4 else 0.1)
                  }

                  conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Llama ($modelName): $err")
                  }
              }

              override fun onPause() {
                  saveCurrentPosition()
                  super.onPause()
              }

              override fun onDestroy() {
                  saveCurrentPosition()
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  pfd?.close()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity updated with Fast Auto-Start and Sync Pacing"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-PacingFixed-apk
          path: "**/build/outputs/apk/debug/*.apk"
