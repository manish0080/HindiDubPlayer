name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          else
            echo "No zip file found!"
          fi
          ls -la

      - name: Build Debug APK
        run: |
          TARGET_DIR=$(find . -maxdepth 1 -type d -name "*Hindi*DubPlayer*" ! -name ".*" | head -1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-starter-debug
          path: "**/build/outputs/apk/debug/*.apk"
