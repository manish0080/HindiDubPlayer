name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Add Internet Permission & Orientation Config Fix
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' {} + || true
          find . -name "AndroidManifest.xml" -exec sed -i 's/<activity /<activity android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize" /g' {} + || true

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
