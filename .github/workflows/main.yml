name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Fix AGP 9 & Build Settings
        run: |
          # AGP 9 ke anusaar puraani lines aur broken compose settings ko clean karein
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Fix MainActivity Code
        run: |
          for file in $(find . -name "MainActivity.kt"); do
            PACKAGE=$(grep -m1 '^package ' "$file" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")
            cat << 'EOF' > "$file"
          package PACKAGE_NAME

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.VideoView

          class MainActivity : Activity() {

              private lateinit var videoView: VideoView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.gravity = Gravity.CENTER_HORIZONTAL
                  layout.setPadding(32, 32, 32, 32)

                  val title = TextView(this)
                  title.text = "HindiDubPlayer"
                  title.textSize = 24f
                  title.gravity = Gravity.CENTER
                  layout.addView(title, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))

                  val button = Button(this)
                  button.text = "Select Video"
                  layout.addView(button, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))

                  videoView = VideoView(this)
                  val videoParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0
                  )
                  videoParams.weight = 1f
                  videoParams.topMargin = 24
                  layout.addView(videoView, videoParams)

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  button.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      intent.addCategory(Intent.CATEGORY_OPENABLE)
                      intent.type = "video/*"
                      startActivityForResult(intent, 100)
                  }

                  setContentView(layout)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri: Uri? = data?.data
                      if (uri != null) {
                          videoView.setVideoURI(uri)
                          videoView.start()
                      }
                  }
              }
          }
          EOF
            sed -i "s/PACKAGE_NAME/$PACKAGE/" "$file"
            echo "Successfully fixed: $file with package $PACKAGE"
          done

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Found Project Directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-starter-debug
          path: "**/build/outputs/apk/debug/*.apk"
