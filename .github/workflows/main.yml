              private fun purgeSessionTempFiles() {
                  try {
                      cacheDir.listFiles()?.forEach { file ->
                          if (file.name.startsWith("chunk_") || file.name.startsWith("session_dub_") || file.name.startsWith("dub_cache_") || file.name.startsWith("clone_tts_")) {
                              file.delete()
                          }
                      }
                  } catch (e: Exception) {
