              private fun startSampleRecording(statusView: TextView, btn: Button) {
                  try {
                      recordedSampleFile = File(cacheDir, "my_voice_sample.m4a")
                      if (recordedSampleFile!!.exists()) recordedSampleFile!!.delete()

                      mediaRecorder = MediaRecorder().apply {
                          setAudioSource(MediaRecorder.AudioSource.MIC)
                          setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          setAudioEncodingBitRate(128000)
                          setAudioSamplingRate(44100)
                          setOutputFile(recordedSampleFile!!.absolutePath)
                          prepare()
                          start()
                      }
                      isRecordingSample = true
                      btn.text = "⏹️ Stop Recording"
                      statusView.text = "Recording... Speak clearly in Hindi for 10s!"
                      statusView.setTextColor(Color.parseColor("#FF5252"))

                  } catch (e: Exception) {
                      e.printStackTrace()
                      Toast.makeText(this, "Mic error: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun stopSampleRecording(statusView: TextView, btn: Button) {
                  try {
                      mediaRecorder?.stop()
                      mediaRecorder?.release()
                      mediaRecorder = null
                      isRecordingSample = false
                      btn.text = "🔄 Record Again"
                      statusView.text = "Sample recorded! Tap 'Save & Use My Voice' to clone."
                      statusView.setTextColor(Color.parseColor("#00E676"))

                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun uploadVoiceSampleToElevenLabs(audioFile: File, apiKey: String) {
                  Thread {
                      try {
                          val boundary = "BoundaryVoice" + System.currentTimeMillis()
                          val lineEnd = "\r\n"
                          val twoHyphens = "--"

                          val url = URL("https://api.elevenlabs.io/v1/voices/add")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("xi-api-key", apiKey)
                              setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                              connectTimeout = 15000
                              readTimeout = 30000
                              doOutput = true
                          }

                          val out = DataOutputStream(conn.outputStream)

                          // Voice Name
                          out.writeBytes(twoHyphens + boundary + lineEnd)
                          out.writeBytes("Content-Disposition: form-data; name=\"name\"" + lineEnd + lineEnd)
                          out.writeBytes("MyClonedVoice" + lineEnd)

                          // Audio File Part
                          out.writeBytes(twoHyphens + boundary + lineEnd)
                          out.writeBytes("Content-Disposition: form-data; name=\"files\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                          out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                          FileInputStream(audioFile).use { fis ->
                              val buf = ByteArray(4096)
                              var bytesRead: Int
                              while (fis.read(buf).also { bytesRead = it } != -1) {
                                  out.write(buf, 0, bytesRead)
                              }
                          }
                          out.writeBytes(lineEnd)
                          out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                          out.flush()
                          out.close()

                          if (conn.responseCode == 200) {
                              val res = conn.inputStream.bufferedReader().use { it.readText() }
                              val voiceId = JSONObject(res).optString("voice_id", "")
                              if (voiceId.isNotBlank()) {
                                  customVoiceId = voiceId
                                  useCustomClonedVoice = true
                                  getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                                      .putString("CUSTOM_VOICE_ID", voiceId)
                                      .putBoolean("USE_CUSTOM_VOICE", true)
                                      .apply()

                                  runOnUiThread {
                                      updateSettingsValues()
                                      Toast.makeText(this@MainActivity, "🎉 Voice successfully cloned!", Toast.LENGTH_LONG).show()
                                  }
                              }
                          } else {
                              runOnUiThread {
                                  Toast.makeText(this@MainActivity, "ElevenLabs API Error: code ${conn.responseCode}", Toast.LENGTH_LONG).show()
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }.start()
              }

