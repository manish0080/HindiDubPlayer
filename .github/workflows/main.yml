              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      selectedVideoUri = uri

                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}

                      isProcessing.set(false)
                      tts?.stop()
                      isSpeechActive.set(false)
                      seekTargetMs.set(-1L)
                      timelineDubQueue.clear()
                      sessionCacheMap.clear()
                      recentSpokenTexts.clear()
                      currentlyPlayingSegment = null
                      fullscreenSubtitleView.text = ""

                      videoView.setVideoURI(uri)

                      val savedPos = getSharedPreferences("DubSettings", Context.MODE_PRIVATE)
                          .getInt("POS_" + uri.toString().hashCode(), 0)

                      if (savedPos > 5000) {
                          AlertDialog.Builder(this)
                              .setTitle("Resume Video")
                              .setMessage("Previous playback stopped at ${formatTime(savedPos.toLong())}. Resume from here?")
                              .setPositiveButton("Resume") { _, _ ->
                                  videoView.seekTo(savedPos)
                                  statusBadge.text = "Resumed at ${formatTime(savedPos.toLong())}"
                                  centerStartBtn.visibility = View.VISIBLE
                                  showOverlayControls()
                              }
                              .setNegativeButton("Start from beginning") { _, _ ->
                                  videoView.seekTo(1)
                                  statusBadge.text = "Video loaded"
                                  centerStartBtn.visibility = View.VISIBLE
                                  showOverlayControls()
                              }
                              .setCancelable(false)
                              .show()
                      } else {
                          videoView.seekTo(1)
                          statusBadge.text = "Ready to start live dubbing"
                          centerStartBtn.visibility = View.VISIBLE
                          showOverlayControls()
                      }
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  isSeeking.set(false)
                  isSpeechActive.set(false)
                  timelineDubQueue.clear()
                  recentSpokenTexts.clear()
                  currentlyPlayingSegment = null
                  statusBadge.text = "Pre-buffering live dialogue session..."

                  Thread {
                      runLookAheadProducer(uri)
                  }.start()
              }

              private fun startTimestampConsumerLoop() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (isProcessing.get() && videoView.isPlaying && !isSeeking.get()) {
                              val curPos = videoView.currentPosition.toLong()
                              val now = System.currentTimeMillis()

                              val tightGapMs = (160L / currentPlaybackSpeed).toLong().coerceIn(90L, 160L)
                              val isBusySpeaking = isSpeechActive.get() || (tts?.isSpeaking == true)

                              if (!isBusySpeaking && (now - lastSpeechEndTimeMs >= tightGapMs)) {
                                  for (segment in timelineDubQueue) {
                                      if (!segment.isTriggered && curPos >= segment.startMs - 200L) {
                                          if (curPos <= segment.endMs + 3500L) {
                                              val normText = segment.translatedText.trim().lowercase()

                                              val isRecentlySpoken = recentSpokenTexts.any {
                                                  (it.first == normText || calculateSimilarity(it.first, normText) > 0.8) &&
                                                  (now - it.second < 12000L)
                                              }

                                              segment.isTriggered = true

                                              if (!isRecentlySpoken) {
                                                  currentlyPlayingSegment = segment

                                                  originalContentView.text = segment.originalText
                                                  translatedContentView.text = segment.translatedText
                                                  fullscreenSubtitleView.text = segment.translatedText

                                                  speakerTagBadge.visibility = View.VISIBLE
                                                  speakerTagBadge.text = "SPEAKER: ${segment.speakerType.uppercase()}"
                                                  statusBadge.text = "Dubbing Active ($targetLangName) [${currentPlaybackSpeed}x]"

                                                  recentSpokenTexts.add(normText to now)
                                                  while (recentSpokenTexts.size > 8) recentSpokenTexts.poll()

                                                  speakDubbed(segment.translatedText, segment.speakerType)
                                              }
                                              break
                                          } else {
                                              segment.isTriggered = true
                                          }
                                      }
                                  }
                              }

                              timelineDubQueue.removeIf { it.isTriggered && curPos > it.endMs + 8000L }
                          }
                          uiHandler.postDelayed(this, 40)
                      }
                  }, 40)
              }

              private fun calculateSimilarity(s1: String, s2: String): Double {
                  if (s1 == s2) return 1.0
                  val longer = if (s1.length > s2.length) s1 else s2
                  val shorter = if (s1.length > s2.length) s2 else s1
                  if (longer.isEmpty()) return 1.0
                  return if (longer.contains(shorter)) (shorter.length.toDouble() / longer.length.toDouble()) else 0.0
              }

              private fun populateAccountModels(apiKey: String) {
                  if (candidateModels.isNotEmpty()) return

                  try {
                      val url = URL("https://api.groq.com/openai/v1/models")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          connectTimeout = 6000
                          readTimeout = 6000
                          doInput = true
                      }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val data = JSONObject(res).optJSONArray("data")
                          if (data != null && data.length() > 0) {
                              for (i in 0 until data.length()) {
                                  val item = data.getJSONObject(i)
                                  val id = item.optString("id", "").trim()
                                  val isActive = item.optBoolean("active", true)

                                  if (isActive && id.isNotBlank() &&
                                      !id.contains("whisper", true) &&
                                      !id.contains("guard", true) &&
                                      !id.contains("vision", true) &&
                                      !id.contains("embed", true) &&
                                      !id.contains("orpheus", true) &&
                                      !id.contains("tts", true) &&
                                      !id.contains("qwen-2.5", true) &&
                                      !id.contains("llama3-8b-8192", true)) {
                                      candidateModels.add(id)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  candidateModels.sortByDescending {
                      when {
                          it.contains("gpt-oss-20b", true) -> 100
                          it.contains("gpt-oss-120b", true) -> 95
                          it.contains("llama-3.1-8b-instant", true) -> 90
                          it.contains("llama-3.3-70b", true) -> 85
                          it.contains("mixtral", true) -> 80
                          else -> 20
                      }
                  }
              }

              private fun extractAudioSegment(startMs: Long, durationMs: Long, audioFormat: MediaFormat, audioTrackIndex: Int): File? {
                  val uri = selectedVideoUri ?: return null
                  val pfdItem = contentResolver.openFileDescriptor(uri, "r") ?: return null

                  pfdItem.use { fd ->
                      val extractor = MediaExtractor()
                      try {
                          extractor.setDataSource(fd.fileDescriptor)
                          extractor.selectTrack(audioTrackIndex)

                          val startUs = startMs * 1000L
                          val endUs = (startMs + durationMs) * 1000L

                          extractor.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC)

                          while (extractor.sampleTime < startUs && extractor.sampleTime >= 0) {
                              if (!extractor.advance()) break
                          }

                          val outputFile = File(cacheDir, "chunk_${System.currentTimeMillis()}.m4a")
                          if (outputFile.exists()) outputFile.delete()

                          val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          val buffer = ByteBuffer.allocate(1024 * 1024)
                          val bufferInfo = MediaCodec.BufferInfo()
                          var firstSampleTimeUs = -1L
                          var lastPts = 0L
                          var samplesWritten = 0

                          while (isProcessing.get() && seekTargetMs.get() < 0) {
                              buffer.clear()
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) break

                              val rawPts = extractor.sampleTime
                              if (rawPts >= endUs) break

                              if (firstSampleTimeUs == -1L) firstSampleTimeUs = rawPts

                              var relativePts = rawPts - firstSampleTimeUs
                              if (relativePts <= lastPts) {
                                  relativePts = lastPts + 10_000L
                              }
                              lastPts = relativePts

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = relativePts
                              bufferInfo.flags = if (samplesWritten == 0) {
                                  extractor.sampleFlags or MediaCodec.BUFFER_FLAG_KEY_FRAME
                              } else {
                                  extractor.sampleFlags
                              }

                              buffer.position(0)
                              buffer.limit(sampleSize)

                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              samplesWritten++

                              if (!extractor.advance()) break
                          }

                          try {
                              if (samplesWritten > 0) muxer.stop()
                              muxer.release()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          extractor.release()

                          return if (outputFile.exists() && samplesWritten >= 5 && outputFile.length() > 500) {
                              outputFile
                          } else {
                              outputFile.delete()
                              null
                          }
                      } catch (e: Exception) {
                      }
                      return null
                  }
              }

              private fun runLookAheadProducer(uri: Uri) {
                  val testPfd = contentResolver.openFileDescriptor(uri, "r")
                  val testExtractor = MediaExtractor()

                  var audioTrackIndex = -1
                  var audioFormat: MediaFormat? = null

                  testPfd?.use { fd ->
                      testExtractor.setDataSource(fd.fileDescriptor)
                      for (i in 0 until testExtractor.trackCount) {
                          val format = testExtractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }
                      testExtractor.release()
                  }

                  if (audioTrackIndex < 0 || audioFormat == null) {
                      runOnUiThread { statusBadge.text = "No audio track found in video!" }
                      return
                  }

                  populateAccountModels(groqApiKey)

                  var nextProducerPosMs = videoView.currentPosition.toLong()
                  var lastGroqCallTime = 0L

                  while (isProcessing.get()) {
                      try {
                          val jumped = seekTargetMs.getAndSet(-1L)
                          if (jumped >= 0) {
                              nextProducerPosMs = jumped
                              timelineDubQueue.clear()
                              currentlyPlayingSegment = null
                          }

                          val currentVideoPos = videoView.currentPosition.toLong()

                          if (!isSeeking.get() && nextProducerPosMs - currentVideoPos > 18000L) {
                              Thread.sleep(300)
                              continue
                          }

                          val chunkDuration = 8_000L
                          val extractStart = nextProducerPosMs
                          val extractEnd = extractStart + chunkDuration

                          val cachedInWindow = sessionCacheMap.values
                              .filter { it.startMs in (extractStart - 1000L)..extractEnd }
                              .sortedBy { it.startMs }

                          if (cachedInWindow.isNotEmpty()) {
                              cachedInWindow.forEach { seg ->
                                  if (!timelineDubQueue.contains(seg)) {
                                      seg.isTriggered = false
                                      timelineDubQueue.add(seg)
                                  }
                              }

                              nextProducerPosMs = extractEnd

                              if (isSeeking.get() || !videoView.isPlaying) {
                                  runOnUiThread {
                                      isSeeking.set(false)
                                      mediaPlayerRef?.setVolume(0f, 0f)
                                      applyVideoPlaybackSpeed()
                                      videoView.start()
                                      onScreenPlayPauseBtn.text = "⏸"
                                      statusBadge.text = "⚡ Instant Cache Loaded ($targetLangName)"
                                  }
                              }
                              continue
                          }

                          val elapsed = System.currentTimeMillis() - lastGroqCallTime
                          if (elapsed < 3000L) {
                              Thread.sleep(3000L - elapsed)
                          }

                          val chunkFile = extractAudioSegment(extractStart, chunkDuration, audioFormat, audioTrackIndex)

                          if (seekTargetMs.get() >= 0) {
                              chunkFile?.delete()
                              continue
                          }

                          nextProducerPosMs = extractEnd

                          if (chunkFile != null && chunkFile.exists()) {
                              lastGroqCallTime = System.currentTimeMillis()

                              val rawSegments = transcribeVerboseSegments(chunkFile, groqApiKey)
                              chunkFile.delete()

                              if (seekTargetMs.get() >= 0) continue

                              if (rawSegments.isNotEmpty()) {
                                  val textsToTranslate = rawSegments.map { it.originalText }
                                  val translatedObjects = batchTranslateDialogues(textsToTranslate, targetLangName, dubStyleKey, groqApiKey)

                                  if (seekTargetMs.get() >= 0) continue

                                  for (i in rawSegments.indices) {
                                      val seg = rawSegments[i]
                                      val transObj = if (i < translatedObjects.size) translatedObjects[i] else ("" to "man")
                                      val translated = cleanTextForDubbing(transObj.first, targetLangCode)
                                      val speaker = transObj.second

                                      if (translated.isNotBlank()) {
                                          val absStart = extractStart + seg.startMs
                                          val absEnd = extractStart + seg.endMs
                                          val newSeg = TimestampDubSegment(absStart, absEnd, seg.originalText, translated, speaker)

                                          sessionCacheMap[absStart] = newSeg
                                          timelineDubQueue.add(newSeg)
                                      }
                                  }

                                  if (isSeeking.get() || !videoView.isPlaying) {
                                      runOnUiThread {
                                          isSeeking.set(false)
                                          mediaPlayerRef?.setVolume(0f, 0f)
                                          applyVideoPlaybackSpeed()
                                          videoView.start()
                                          onScreenPlayPauseBtn.text = "⏸"
                                          statusBadge.text = "Dubbing Active ($targetLangName) [${currentPlaybackSpeed}x]"
                                      }
                                  }
                              } else {
                                  if (isSeeking.get() || !videoView.isPlaying) {
                                      runOnUiThread {
                                          isSeeking.set(false)
                                          applyVideoPlaybackSpeed()
                                          videoView.start()
                                          onScreenPlayPauseBtn.text = "⏸"
                                          statusBadge.text = "Playing (Music/Silence)"
                                      }
                                  }
                              }
                          } else {
                              if (isSeeking.get() || !videoView.isPlaying) {
                                  runOnUiThread {
                                      isSeeking.set(false)
                                      applyVideoPlaybackSpeed()
                                      videoView.start()
                                      onScreenPlayPauseBtn.text = "⏸"
                                  }
                              }
                          }

                      } catch (e: Exception) {
                          Thread.sleep(1500)
                      }
                  }
              }

              private fun transcribeVerboseSegments(audioFile: File, apiKey: String): List<TimestampDubSegment> {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val lineEnd = "\r\n"
                  val twoHyphens = "--"

                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                      connectTimeout = 12000
                      readTimeout = 25000
                      doOutput = true
                      doInput = true
                  }

                  val out = DataOutputStream(conn.outputStream)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"" + lineEnd + lineEnd)
                  out.writeBytes("whisper-large-v3-turbo" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"" + lineEnd + lineEnd)
                  out.writeBytes("verbose_json" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"temperature\"" + lineEnd + lineEnd)
                  out.writeBytes("0.0" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                  out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var bytesRead: Int
                      while (fis.read(buf).also { bytesRead = it } != -1) {
                          out.write(buf, 0, bytesRead)
                      }
                  }

                  out.writeBytes(lineEnd)
                  out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                  out.flush()
                  out.close()

                  val segmentsList = mutableListOf<TimestampDubSegment>()

                  if (conn.responseCode == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      val root = JSONObject(res)
                      val jsonSegments = root.optJSONArray("segments")

                      if (jsonSegments != null && jsonSegments.length() > 0) {
                          for (i in 0 until jsonSegments.length()) {
                              val item = jsonSegments.getJSONObject(i)
                              val startSec = item.optDouble("start", 0.0)
                              val endSec = item.optDouble("end", 0.0)
                              val text = item.optString("text", "").trim()

                              if (isRealSpeech(text)) {
                                  val startMs = (startSec * 1000.0).toLong()
                                  val endMs = (endSec * 1000.0).toLong().coerceAtLeast(startMs + 1000L)
                                  segmentsList.add(TimestampDubSegment(startMs, endMs, text, ""))
                              }
                          }
                      }
                  }
                  return segmentsList
              }

              // Netflix Cinematic & Anime Dub Director Master Prompt
              private fun buildMasterSystemPrompt(targetLang: String, style: String): String {
                  return """
                  You are an elite Netflix / Crunchyroll Hindi Anime Dubbing Voice Director.
                  Your mission is to adapt dialogue into hyper-natural, cinematic, and punchy Hindi/Hinglish in Devanagari script so that it sounds like real humans in an expensive anime movie, NEVER like robotic machine translation.

                  GOLDEN CINEMATIC DUBBING PRINCIPLES:
                  1. AUTHENTIC VOCAL CADENCE & NATURAL FILLERS:
                     - Don't just translate words; translate the breath, emotion, and attitude of the scene!
                     - Blend natural spoken conversational fillers organically:
                       * 'अरे यार...', 'सुनो,', 'वेट...', 'ओह!', 'रुको जरा,', 'व्हाट?!', 'मतलब कुछ भी!', 'सीरियसली!', 'नो वे!'
                     - Break rigid long sentences into snappy, natural dialogue punches.

                  2. 100% ELIMINATE ARCHAIC BOOKISH HINDI:
                     - STRICTLY FORBIDDEN words: 'भूभाग', 'जटिल', 'प्रतीक्षा', 'प्रस्थान', 'कदापि', 'सामर्थ्य', 'अवश्य', 'संदेह', 'मित्रवर'.
                     - Use real spoken Indian urban vocabulary in Devanagari:
                       'एरिया', 'प्रॉब्लम', 'टेंशन', 'आइडिया', 'वेट', 'सीरियस', 'प्लान', 'लोकेशन', 'चेक', 'ट्रैक', 'रेडी', 'फोकस', 'चांस', 'कॉम्प्लिकेटेड', 'इम्पॉसिबल', 'सॉरी', 'थैंक यू', 'प्लीज', 'ओके', 'कम ऑन', 'लेट्स गो', 'बॉस', 'गाइज', 'डेंजरस', 'मिस', 'कॉल', 'मैसेज', 'फोन', 'टीम'.

                  3. STRICT CHARACTER & GENDER-VERB INFLECTION:
                     - Accurately determine speaker character: 'man', 'woman', 'boy', 'girl'.
                     - Female / Girl: First-person verbs & possessives MUST be feminine ('करती हूँ', 'जा रही हूँ', 'सोचती हूँ', 'बताऊँगी', 'मेरी', 'खुश हूँ'). NEVER use masculine verbs ('करता हूँ', 'जा रहा हूँ') for female characters!
                     - Male / Boy: First-person verbs MUST be masculine ('करता हूँ', 'जा रहा हूँ', 'सोचता हूँ', 'बताऊँगा', 'मेरा').

                  4. BREATHING & RHYTHMIC PUNCTUATION:
                     - To create natural human breathing in TTS, use ONLY commas (,) for quick 120ms pauses and Devanagari purna viram (।) for natural sentence ends.
                     - NEVER output English dots (.), semicolons (;), or ellipsis (...). Write abbreviations in full ('डॉक्टर', 'मिस्टर').

                  OUTPUT FORMAT:
                  Output ONLY a valid JSON array of objects:
                  [{"text": "अरे यार, यह एरिया तो काफी डेंजरस और कॉम्प्लिकेटेड लग रहा है।", "speaker": "man"}]
                  No explanation, no markdown ticks, only pure JSON.
                  """.trimIndent()
              }

              private fun batchTranslateDialogues(texts: List<String>, targetLang: String, style: String, apiKey: String): List<Pair<String, String>> {
                  if (texts.isEmpty()) return emptyList()

                  val jsonInput = JSONArray()
                  texts.forEach { jsonInput.put(it) }

                  val prompt = buildMasterSystemPrompt(targetLang, style)
                  val model = activeLockedModel ?: "llama-3.1-8b-instant"

                  try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 10000
                          readTimeout = 20000
                          doOutput = true
                          doInput = true
                      }

                      val payload = JSONObject().apply {
                          put("model", model)
                          val messages = JSONArray().apply {
                              put(JSONObject().apply {
                                  put("role", "system")
                                  put("content", prompt)
                              })
                              put(JSONObject().apply {
                                  put("role", "user")
                                  put("content", jsonInput.toString())
                              })
                          }
                          put("messages", messages)
                          put("temperature", 0.15)
                      }

                      conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val rawContent = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()

                          val cleanJson = if (rawContent.contains("[")) {
                              rawContent.substring(rawContent.indexOf("["), rawContent.lastIndexOf("]") + 1)
                          } else rawContent

                          val parsedArr = JSONArray(cleanJson)
                          val results = mutableListOf<Pair<String, String>>()
                          for (i in 0 until parsedArr.length()) {
                              val item = parsedArr.optJSONObject(i)
                              if (item != null) {
                                  val text = item.optString("text", "")
                                  val speaker = item.optString("speaker", "man").lowercase()
                                  results.add(text to speaker)
                              } else {
                                  results.add(parsedArr.getString(i) to "man")
                              }
                          }
                          activeLockedModel = model
                          return results
                      }
                  } catch (_: Exception) {}

                  return texts.map { translateSingleDialogueWithSpeaker(it, targetLang, style, apiKey) }
              }

              private fun translateSingleDialogueWithSpeaker(sourceText: String, targetLang: String, style: String, apiKey: String): Pair<String, String> {
                  val modelsToTry = mutableListOf<String>()
                  activeLockedModel?.let { modelsToTry.add(it) }
                  modelsToTry.addAll(candidateModels)
                  listOf("openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "mixtral-8x7b-32768").forEach {
                      if (!modelsToTry.contains(it)) modelsToTry.add(it)
                  }

                  val systemPrompt = buildMasterSystemPrompt(targetLang, style)

                  for (model in modelsToTry) {
                      try {
                          val url = URL("https://api.groq.com/openai/v1/chat/completions")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Authorization", "Bearer $apiKey")
                              setRequestProperty("Content-Type", "application/json")
                              connectTimeout = 8000
                              readTimeout = 15000
                              doOutput = true
                              doInput = true
                          }

                          val payload = JSONObject().apply {
                              put("model", model)
                              val messages = JSONArray().apply {
                                  put(JSONObject().apply {
                                      put("role", "system")
                                      put("content", systemPrompt)
                                  })
                                  put(JSONObject().apply {
                                      put("role", "user")
                                      put("content", "[\"$sourceText\"]")
                                  })
                              }
                              put("messages", messages)
                              put("max_tokens", 250)
                              put("temperature", 0.15)
                          }

                          conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                          if (conn.responseCode == 200) {
                              val res = conn.inputStream.bufferedReader().use { it.readText() }
                              val output = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                              val clean = if (output.contains("[")) output.substring(output.indexOf("["), output.lastIndexOf("]") + 1)
                                           else if (output.contains("{")) output.substring(output.indexOf("{"), output.lastIndexOf("}") + 1)
                                           else output

                              if (clean.startsWith("[")) {
                                  val arr = JSONArray(clean)
                                  if (arr.length() > 0) {
                                      val obj = arr.getJSONObject(0)
                                      activeLockedModel = model
                                      return obj.optString("text", sourceText) to obj.optString("speaker", "man").lowercase()
                                  }
                              } else if (clean.startsWith("{")) {
                                  val obj = JSONObject(clean)
                                  activeLockedModel = model
                                  return obj.optString("text", output) to obj.optString("speaker", "man").lowercase()
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return sourceText to "man"
              }

              private fun isRealSpeech(text: String): Boolean {
                  val trimmed = text.trim()
                  if (trimmed.length < 3) return false
                  val lower = trimmed.lowercase()

                  if (lower.contains("subtitles by") || lower.contains("amara.org") || lower.contains("thank you for watching")) {
                      return false
                  }
                  if (trimmed.startsWith("[") && trimmed.endsWith("]")) return false
                  if (trimmed.startsWith("(") && trimmed.endsWith(")")) return false

                  val words = trimmed.split(" ")
                  if (words.size > 8) {
                      val uniqueWords = words.toSet()
                      if (uniqueWords.size < words.size / 3) return false
                  }
                  return true
              }

              // Human Micro-Pausing & Clean Dialogue Filter
              private fun cleanTextForDubbing(text: String, langCode: String): String {
                  var res = text.trim()

                  res = res.replace(Regex("[*\"#_`~]"), " ")

                  res = res.replace(Regex("(?i)\\b(dr|dr\\.)\\b"), "डॉक्टर")
                  res = res.replace(Regex("(?i)\\b(mr|mr\\.)\\b"), "मिस्टर")
                  res = res.replace(Regex("(?i)\\b(mrs|mrs\\.)\\b"), "मिसेज")
                  res = res.replace(Regex("(?i)\\b(ms|ms\\.)\\b"), "मिस")
                  res = res.replace(Regex("(?i)\\b(ok|okay)\\b"), "ओके")
                  res = res.replace(Regex("(?i)\\b(sir)\\b"), "सर")

                  // Replace dots and pauses with micro-breaths
                  res = res.replace("...", ", ")
                  res = res.replace("..", ", ")
                  res = res.replace(".", "। ")
                  res = res.replace("!", "। ")
                  res = res.replace("?", "। ")
                  res = res.replace(";", ", ")
                  res = res.replace(":", ", ")
                  res = res.replace("-", " ")
                  res = res.replace("—", " ")
                  res = res.replace("/", " ")
                  res = res.replace("\\", " ")
                  res = res.replace("(", " ")
                  res = res.replace(")", " ")
                  res = res.replace("[", " ")
                  res = res.replace("]", " ")
                  res = res.replace("{", " ")
                  res = res.replace("}", " ")

                  res = res.replace(Regex("(?i)\\b(dot|comma|point|dash|full stop|semicolon|colon)\\b"), " ")
                  res = res.replace(Regex("\\b(डॉट|कॉमा|पॉइंट|डैश|फुल स्टॉप)\\b"), " ")

                  res = res.replace(Regex("।+"), "।")
                  res = res.replace(Regex(",+"), ",")
                  res = res.replace(Regex("\\s+"), " ").trim()

                  return res
              }

              private fun speakDubbed(text: String, speakerType: String) {
                  applyCharacterVoice(speakerType)
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  isSpeechActive.set(true)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "dub_${System.currentTimeMillis()}")
              }

              override fun onPause() {
                  saveCurrentPosition()
                  super.onPause()
              }

              override fun onDestroy() {
                  saveCurrentPosition()
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  timelineDubQueue.clear()
                  sessionCacheMap.clear()
                  recentSpokenTexts.clear()
                  purgeSessionTempFiles()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity successfully upgraded to Cinematic Netflix Dub Engine"

