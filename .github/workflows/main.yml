              private fun setupSeekBarListeners() {
                  onScreenSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {
                          isUserTouchingSeekBar = true
                          uiHandler.removeCallbacks(hideControlsRunnable)
                      }

                      override fun onStopTrackingTouch(seekBar: SeekBar?) {
                          isUserTouchingSeekBar = false
                          val targetPos = seekBar?.progress ?: 0
                          videoView.seekTo(targetPos)
                          handleSeekTo(targetPos.toLong())
                          touchResetOverlayTimer()
                      }

                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              val total = videoView.duration.toLong()
                              onScreenTimeStatusView.text = "${formatTime(progress.toLong())} / ${formatTime(total)}"
                          }
                      }
                  })
              }

              private fun setupVlcGestures() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          toggleOverlayControls()
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          val width = touchOverlayView.width.toFloat()
                          if (width <= 0f) return false
                          val x = e.x

                          if (x < width * 0.35f) {
                              val newPos = (videoView.currentPosition - 10000).coerceAtLeast(0)
                              handleSeekTo(newPos.toLong())
                              videoView.seekTo(newPos)
                              showCenterIndicator("⏪ -10s")
                          } else if (x > width * 0.65f) {
                              val newPos = (videoView.currentPosition + 10000).coerceAtMost(videoView.duration)
                              handleSeekTo(newPos.toLong())
                              videoView.seekTo(newPos)
                              showCenterIndicator("⏩ +10s")
                          } else {
                              togglePlayPause()
                          }
                          return true
                      }
                  })

                  touchOverlayView.setOnTouchListener { v, event ->
                      gestureDetector.onTouchEvent(event)
                      val width = v.width.toFloat()
                      val height = v.height.toFloat()

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              touchStartX = event.x
                              touchStartY = event.y
                              gestureMode = 0
                              initialVolume = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                              val lp = window.attributes
                              initialBrightness = if (lp.screenBrightness < 0) 0.5f else lp.screenBrightness
                              initialSeekPos = videoView.currentPosition.toLong()
                              targetGestureSeekPos = initialSeekPos
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - touchStartX
                              val dy = event.y - touchStartY

                              if (gestureMode == 0) {
                                  if (Math.abs(dx) > dpToPx(20) && Math.abs(dx) > Math.abs(dy)) {
                                      gestureMode = 3
                                  } else if (Math.abs(dy) > dpToPx(20) && Math.abs(dy) > Math.abs(dx)) {
                                      gestureMode = if (touchStartX < width * 0.5f) 2 else 1
                                  }
                              }

                              if (gestureMode == 1) {
                                  val deltaVol = ((-dy / height) * maxVolume * 1.4f).toInt()
                                  val newVol = (initialVolume + deltaVol).coerceIn(0, maxVolume)
                                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, newVol, 0)
                                  val percent = (newVol * 100) / maxVolume
                                  showCenterIndicator("🔊 Volume: $percent%")
                              } else if (gestureMode == 2) {
                                  val delta = (-dy / height) * 1.2f
                                  val newB = (initialBrightness + delta).coerceIn(0.01f, 1.0f)
                                  val lp = window.attributes
                                  lp.screenBrightness = newB
                                  window.attributes = lp
                                  val percent = (newB * 100).toInt()
                                  showCenterIndicator("☀️ Brightness: $percent%")
                              } else if (gestureMode == 3) {
                                  val totalDuration = videoView.duration.toLong().coerceAtLeast(1L)
                                  val deltaMs = ((dx / width) * 90000L).toLong()
                                  targetGestureSeekPos = (initialSeekPos + deltaMs).coerceIn(0L, totalDuration)
                                  val sign = if (deltaMs >= 0) "+" else ""
                                  showCenterIndicator("⏱ ${formatTime(targetGestureSeekPos)} (${sign}${deltaMs / 1000}s)")
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (gestureMode == 3 && targetGestureSeekPos >= 0) {
                                  videoView.seekTo(targetGestureSeekPos.toInt())
                                  handleSeekTo(targetGestureSeekPos)
                              }
                              gestureMode = 0
                              uiHandler.postDelayed(hideIndicatorRunnable, 1000)
                          }
                      }
                      true
                  }
              }

              private fun showCenterIndicator(text: String) {
                  centerIndicatorBadge.text = text
