name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Utility
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d .
          fi

      - name: Add App Icon
        run: |
          echo "Installing Hindi Dub Player launcher icon..."

          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          RES=$(find "$PROJECT_ROOT" -type d -path '*/src/main/res' | head -1)
          MANIFEST=$(find "$PROJECT_ROOT" -name "AndroidManifest.xml" | head -1)

          if [ -z "$RES" ] || [ -z "$MANIFEST" ]; then
            echo "ERROR: res or AndroidManifest.xml not found"
            exit 1
          fi

          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found in repository root"
            exit 1
          fi

          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          cp icon.png "$RES/drawable-nodpi/app_icon.png"
          cp icon.png "$RES/mipmap-mdpi/ic_launcher.png"
          cp icon.png "$RES/mipmap-hdpi/ic_launcher.png"
          cp icon.png "$RES/mipmap-xhdpi/ic_launcher.png"
          cp icon.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/app_icon" />
          </adaptive-icon>
          EOF

          sed -i 's/ android:icon="[^"]*"//g' "$MANIFEST"
          sed -i 's/<application[[:space:]]*/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher" /' "$MANIFEST"

      - name: Robust AndroidManifest, Permissions & Queries Fix
        run: |
          python3 - << 'PYEOF'
          import glob, re

          for path in glob.glob("**/AndroidManifest.xml", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              permissions = [
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
                  '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
                  '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />'
              ]

              perm_block = "\n    ".join(permissions) + "\n"
              content = re.sub(r"(<uses-permission[^>]*>\s*)+", "", content)
              content = re.sub(r"(<application\b)", perm_block + r"\1", content)

              if "<queries>" not in content:
                  queries_block = """    <queries>
                      <intent>
                          <action android:name="android.intent.action.TTS_SERVICE" />
                      </intent>
                      <package android:name="com.google.android.tts" />
                  </queries>\n"""
                  content = re.sub(r"(<application\b)", queries_block + r"\1", content)

              content = re.sub(r'\s*android:configChanges="[^"]*"', '', content)
              content = re.sub(r'<activity(\s+)', r'<activity android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode" \1', content)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          print("AndroidManifest.xml patched successfully.")
          PYEOF

          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Inject Final Stable Code Combining Old Stability & New UI
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

