              private fun setTtsLocale(code: String) {
                  val loc = if (code == "hi") Locale("hi", "IN") else Locale(code)
                  val res = tts?.setLanguage(loc)
                  if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.setLanguage(Locale(code))
                  }
              }

              // Ultra-Natural Google Studio Neural Voice Matcher
              private fun applyCharacterVoice(speakerType: String) {
                  try {
                      val voices = tts?.voices ?: emptySet()
                      val langVoices = voices.filter { it.locale.language.equals(targetLangCode, ignoreCase = true) }

                      val effectiveRole = if (voiceTypeIndex == 0) {
                          speakerType.lowercase()
                      } else {
                          when (voiceTypeIndex) {
                              1 -> "man"
                              2 -> "woman"
                              3 -> "boy"
                              4 -> "girl"
                              else -> "man"
                          }
                      }

                      val isFemaleRole = effectiveRole == "woman" || effectiveRole == "girl"

                      val candidateVoices = langVoices.filter { voice ->
                          val name = voice.name.lowercase()
                          if (isFemaleRole) {
                              name.contains("female") || name.contains("woman") || name.contains("hic") || name.contains("hia") || name.contains("c-") || name.contains("a-")
                          } else {
                              name.contains("male") || name.contains("man") || name.contains("hid") || name.contains("hie") || name.contains("d-") || name.contains("e-")
                          }
                      }

                      // Target highest fidelity neural engine (Neural2, Wavenet, Journey)
                      val bestVoice = candidateVoices.maxByOrNull { voice ->
                          var score = 0
                          val n = voice.name.lowercase()
                          if (n.contains("neural2")) score += 80
                          else if (n.contains("wavenet")) score += 60
                          else if (n.contains("neural")) score += 50
                          if (n.contains("x-")) score += 30
                          if (n.contains("network")) score += 20
                          if (voice.quality >= Voice.QUALITY_VERY_HIGH) score += 40
                          else if (voice.quality >= Voice.QUALITY_HIGH) score += 20
                          score
                      } ?: candidateVoices.firstOrNull() ?: langVoices.firstOrNull()

                      if (bestVoice != null) {
                          tts?.voice = bestVoice
                      }

                      // Dynamic Cinematic Prosody (Human Chest & Tone Resonance)
                      var naturalPitch = 1.0f
                      var naturalRate = 1.0f

                      when (effectiveRole) {
                          "woman" -> {
                              naturalPitch = 1.01f
                              naturalRate = 1.02f
                          }
                          "girl" -> {
                              naturalPitch = 1.08f
                              naturalRate = 1.03f
                          }
                          "boy" -> {
                              naturalPitch = 1.04f
                              naturalRate = 1.02f
                          }
                          else -> {
                              // Deep, rich male protagonist timbre
                              naturalPitch = 0.94f
                              naturalRate = 1.00f
                          }
                      }

                      tts?.setPitch(naturalPitch)
                      tts?.setSpeechRate(naturalRate * currentPlaybackSpeed)

                  } catch (e: Exception) {
                      tts?.setPitch(0.96f)
                      tts?.setSpeechRate(1.0f * currentPlaybackSpeed)
                  }
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      setTtsLocale(targetLangCode)
                      applyCharacterVoice("man")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                          tts?.setAudioAttributes(attrs)
                      }

                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) {
                              isSpeechActive.set(true)
                          }

                          override fun onDone(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()

                              uiHandler.postDelayed({
                                  if (!isSpeechActive.get()) {
                                      fullscreenSubtitleView.text = ""
                                  }
                              }, 250)
                          }

                          override fun onError(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.post { fullscreenSubtitleView.text = "" }
                          }
                      })
                  }
              }

