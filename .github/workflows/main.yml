              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  isSeeking.set(false)
                  isSpeechActive.set(false)
                  timelineDubQueue.clear()
                  sessionCacheMap.clear()
                  recentSpokenTexts.clear()
                  currentlyPlayingSegment = null

                  Thread {
                      runLookAheadProducer(uri)
                  }.start()
              }

              private fun setupSeekBarListeners() {
                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          val pos = sb?.progress ?: 0
                          playerVideoView.seekTo(pos)
                          handleSeekTo(pos.toLong())
                      }
                      override fun onProgressChanged(sb: SeekBar?, prog: Int, fromUser: Boolean) {
                          if (fromUser) {
                              playerTimeCurrent.text = formatTime(prog.toLong())
                          }
                      }
                  })
              }

              private fun startSeekBarUpdater() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (selectedVideoUri != null && playerVideoView.isPlaying) {
                              val cur = playerVideoView.currentPosition
                              val total = playerVideoView.duration
                              if (total > 0) {
                                  playerSeekBar.max = total
                                  playerSeekBar.progress = cur
                                  playerTimeCurrent.text = formatTime(cur.toLong())
                                  playerTimeTotal.text = formatTime(total.toLong())
                              }
                          }
                          uiHandler.postDelayed(this, 300)
                      }
                  }, 300)
              }

              private fun handleSeekTo(targetPosMs: Long) {
                  isSeeking.set(true)
                  seekTargetMs.set(targetPosMs)
                  timelineDubQueue.clear()
                  currentlyPlayingSegment = null
                  tts?.stop()
                  isSpeechActive.set(false)
                  lastSpeechEndTimeMs = 0L
                  playerSubtitleText.text = ""

                  val cached = sessionCacheMap.values
                      .filter { it.startMs in (targetPosMs - 1000L)..(targetPosMs + 20000L) }
                      .sortedBy { it.startMs }

                  if (cached.isNotEmpty()) {
                      cached.forEach { seg ->
                          seg.isTriggered = false
                          timelineDubQueue.add(seg)
                      }
                      isSeeking.set(false)
                      applyAudioMuteState()
                      applyVideoPlaybackSpeed()
                      playerVideoView.start()
                      playerPlayPauseBtn.text = "⏸"
                  } else {
                      playerVideoView.pause()
                  }
              }

              private fun startTimestampConsumerLoop() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (isProcessing.get() && playerVideoView.isPlaying && !isSeeking.get()) {
                              val curPos = playerVideoView.currentPosition.toLong()
                              val now = System.currentTimeMillis()

                              val isBusy = isSpeechActive.get() || (tts?.isSpeaking == true)

                              if (!isBusy && (now - lastSpeechEndTimeMs >= 100L)) {
                                  for (segment in timelineDubQueue) {
                                      if (!segment.isTriggered && curPos >= segment.startMs - 200L) {
                                          if (curPos <= segment.endMs + 3500L) {
                                              val norm = segment.translatedText.trim().lowercase()

                                              val isRecentlySpoken = recentSpokenTexts.any {
                                                  (it.first == norm || calculateSimilarity(it.first, norm) > 0.8) && (now - it.second < 12000L)
                                              }

                                              segment.isTriggered = true

                                              if (!isRecentlySpoken) {
                                                  currentlyPlayingSegment = segment
                                                  playerSubtitleText.visibility = View.VISIBLE
                                                  playerSubtitleText.text = segment.translatedText

                                                  recentSpokenTexts.add(norm to now)
                                                  while (recentSpokenTexts.size > 8) recentSpokenTexts.poll()

                                                  if (isHindiDubEnabled) {
                                                      speakDubbed(segment.translatedText, segment.speakerType)
                                                  }
                                              }
                                              break
                                          } else {
                                              segment.isTriggered = true
                                          }
                                      }
                                  }
                              }
                              timelineDubQueue.removeIf { it.isTriggered && curPos > it.endMs + 8000L }
                          }
                          uiHandler.postDelayed(this, 40)
                      }
                  }, 40)
              }

              private fun calculateSimilarity(s1: String, s2: String): Double {
                  if (s1 == s2) return 1.0
                  val longer = if (s1.length > s2.length) s1 else s2
                  val shorter = if (s1.length > s2.length) s2 else s1
                  if (longer.isEmpty()) return 1.0
                  return if (longer.contains(shorter)) (shorter.length.toDouble() / longer.length.toDouble()) else 0.0
              }

              private fun runLookAheadProducer(uri: Uri) {
                  val testPfd = contentResolver.openFileDescriptor(uri, "r")
                  val testExtractor = MediaExtractor()

                  var audioTrackIndex = -1
                  var audioFormat: MediaFormat? = null

                  testPfd?.use { fd ->
                      testExtractor.setDataSource(fd.fileDescriptor)
                      for (i in 0 until testExtractor.trackCount) {
                          val format = testExtractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }
                      testExtractor.release()
                  }

                  if (audioTrackIndex < 0 || audioFormat == null) return

                  var nextProducerPosMs = playerVideoView.currentPosition.toLong()
                  var lastCallTime = 0L

                  while (isProcessing.get()) {
                      try {
                          val jumped = seekTargetMs.getAndSet(-1L)
                          if (jumped >= 0) {
                              nextProducerPosMs = jumped
                              timelineDubQueue.clear()
                          }

                          val curPos = playerVideoView.currentPosition.toLong()
                          if (!isSeeking.get() && nextProducerPosMs - curPos > 18000L) {
                              Thread.sleep(300)
                              continue
                          }

                          val chunkDuration = 8000L
                          val extractStart = nextProducerPosMs
                          val extractEnd = extractStart + chunkDuration

                          val cached = sessionCacheMap.values.filter { it.startMs in (extractStart - 1000L)..extractEnd }
                          if (cached.isNotEmpty()) {
                              cached.forEach { seg ->
                                  if (!timelineDubQueue.contains(seg)) {
                                      seg.isTriggered = false
                                      timelineDubQueue.add(seg)
                                  }
                              }
                              nextProducerPosMs = extractEnd
                              if (isSeeking.get() || !playerVideoView.isPlaying) {
                                  runOnUiThread {
                                      isSeeking.set(false)
                                      applyAudioMuteState()
                                      applyVideoPlaybackSpeed()
                                      playerVideoView.start()
                                      playerPlayPauseBtn.text = "⏸"
                                  }
                              }
                              continue
                          }

                          val elapsed = System.currentTimeMillis() - lastCallTime
                          if (elapsed < 3000L) Thread.sleep(3000L - elapsed)

                          val chunkFile = extractAudioSegment(extractStart, chunkDuration, audioFormat, audioTrackIndex)
                          if (seekTargetMs.get() >= 0) {
                              chunkFile?.delete()
                              continue
                          }
                          nextProducerPosMs = extractEnd

                          if (chunkFile != null && chunkFile.exists()) {
                              lastCallTime = System.currentTimeMillis()
                              val rawSegments = transcribeAudio(chunkFile, groqApiKey)
                              chunkFile.delete()

                              if (rawSegments.isNotEmpty()) {
                                  val texts = rawSegments.map { it.originalText }
                                  val translated = translateBatch(texts, targetLangName, dubStyleKey, groqApiKey)

                                  for (i in rawSegments.indices) {
                                      val seg = rawSegments[i]
                                      val transObj = if (i < translated.size) translated[i] else null
                                      
                                      if (transObj != null && transObj.first.isNotBlank()) {
                                          val clean = cleanDialogue(transObj.first)
                                          if (clean.isNotBlank()) {
                                              val absStart = extractStart + seg.startMs
                                              val absEnd = extractStart + seg.endMs
                                              val newSeg = TimestampDubSegment(absStart, absEnd, seg.originalText, clean, transObj.second)
                                              sessionCacheMap[absStart] = newSeg
                                              timelineDubQueue.add(newSeg)
                                          }
                                      }
                                  }

                                  if (isSeeking.get() || !playerVideoView.isPlaying) {
                                      runOnUiThread {
                                          isSeeking.set(false)
                                          applyAudioMuteState()
                                          applyVideoPlaybackSpeed()
                                          playerVideoView.start()
                                          playerPlayPauseBtn.text = "⏸"
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          Thread.sleep(1500)
                      }
                  }
              }

              private fun extractAudioSegment(startMs: Long, durationMs: Long, audioFormat: MediaFormat, audioTrackIndex: Int): File? {
                  val uri = selectedVideoUri ?: return null
                  val pfd = contentResolver.openFileDescriptor(uri, "r") ?: return null

                  pfd.use { fd ->
                      val extractor = MediaExtractor()
                      try {
                          extractor.setDataSource(fd.fileDescriptor)
                          extractor.selectTrack(audioTrackIndex)

                          val startUs = startMs * 1000L
                          val endUs = (startMs + durationMs) * 1000L
                          extractor.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC)

                          val outputFile = File(cacheDir, "chunk_${System.currentTimeMillis()}.m4a")
                          if (outputFile.exists()) outputFile.delete()

                          val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          val buffer = ByteBuffer.allocate(1024 * 1024)
                          val bufferInfo = MediaCodec.BufferInfo()
                          var firstSampleTimeUs = -1L
                          var lastPts = 0L
                          var samplesWritten = 0

                          while (isProcessing.get() && seekTargetMs.get() < 0) {
                              buffer.clear()
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) break

                              val rawPts = extractor.sampleTime
                              if (rawPts >= endUs) break

                              if (firstSampleTimeUs == -1L) firstSampleTimeUs = rawPts
                              var relativePts = rawPts - firstSampleTimeUs
                              if (relativePts <= lastPts) relativePts = lastPts + 10000L
                              lastPts = relativePts

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = relativePts
                              bufferInfo.flags = if (samplesWritten == 0) extractor.sampleFlags or MediaCodec.BUFFER_FLAG_KEY_FRAME else extractor.sampleFlags

                              buffer.position(0)
                              buffer.limit(sampleSize)
                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              samplesWritten++

                              if (!extractor.advance()) break
                          }
                          try {
                              if (samplesWritten > 0) muxer.stop()
                              muxer.release()
                          } catch (_: Exception) {}
                          extractor.release()

                          return if (outputFile.exists() && samplesWritten >= 5 && outputFile.length() > 500) outputFile else null
                      } catch (_: Exception) { return null }
                  }
              }

              private fun transcribeAudio(audioFile: File, apiKey: String): List<TimestampDubSegment> {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                      connectTimeout = 12000
                      readTimeout = 25000
                      doOutput = true
                  }

                  val out = DataOutputStream(conn.outputStream)
                  out.writeBytes("--$boundary\r\nContent-Disposition: form-data; name=\"model\"\r\n\r\nwhisper-large-v3-turbo\r\n")
                  out.writeBytes("--$boundary\r\nContent-Disposition: form-data; name=\"response_format\"\r\n\r\nverbose_json\r\n")
                  out.writeBytes("--$boundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"${audioFile.name}\"\r\nContent-Type: audio/m4a\r\n\r\n")

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var r: Int
                      while (fis.read(buf).also { r = it } != -1) out.write(buf, 0, r)
                  }
                  out.writeBytes("\r\n--$boundary--\r\n")
                  out.flush()
                  out.close()

                  val list = mutableListOf<TimestampDubSegment>()
                  if (conn.responseCode == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      val segs = JSONObject(res).optJSONArray("segments")
                      if (segs != null) {
                          for (i in 0 until segs.length()) {
                              val item = segs.getJSONObject(i)
                              val start = (item.optDouble("start", 0.0) * 1000.0).toLong()
                              val end = (item.optDouble("end", 0.0) * 1000.0).toLong().coerceAtLeast(start + 1000L)
                              val text = item.optString("text", "").trim()
                              if (text.length >= 3 && !text.contains("subtitles by", true) && !text.contains("thank you for watching", true)) {
                                  list.add(TimestampDubSegment(start, end, text, ""))
                              }
                          }
                      }
                  }
                  return list
              }

              private fun translateBatch(texts: List<String>, targetLang: String, style: String, apiKey: String): List<Pair<String, String>> {
                  if (texts.isEmpty()) return emptyList()

                  val jsonArr = JSONArray()
                  texts.forEach { jsonArr.put(it) }

                  val systemPrompt = """
                  You are an elite Netflix and Crunchyroll Hindi Anime Dubbing Voice Director.
                  Your mission is to translate each dialogue into expressive, natural Hindi / Hinglish in native Devanagari script.

                  CRITICAL DUBBING & GENDER RULES:
                  1. NEVER output English script or return original English lines! Everything must be translated into natural Devanagari script.
                  2. STRICT GENDER-VERB INFLECTION:
                     - Tag speaker accurately: 'woman' (or 'girl') if female, 'man' (or 'boy') if male.
                     - Female speaker MUST use strictly feminine grammar: ('करती हूँ', 'जा रही हूँ', 'सोचती हूँ', 'बताऊँगी', 'मेरी', 'खुश हूँ'). NEVER use masculine verbs for female characters!
                     - Male speaker MUST use strictly masculine grammar: ('करता हूँ', 'जा रहा हूँ', 'सोचता हूँ', 'बताऊँगा', 'मेरा').
                  3. NATURAL CINEMATIC VOCABULARY:
                     - BAN archaic bookish words ('भूभाग', 'जटिल', 'प्रतीक्षा', 'प्रस्थान', 'कदापि', 'सामर्थ्य', 'अवश्य').
                     - Use real natural conversational words in Devanagari:
                       'एरिया', 'प्रॉब्लम', 'टेंशन', 'आइडिया', 'वेट', 'सीरियस', 'प्लान', 'लोकेशन', 'चेक', 'ट्रैक', 'रेडी', 'फोकस', 'चांस', 'कॉम्प्लिकेटेड', 'इम्पॉसिबल', 'सॉरी', 'थैंक यू', 'प्लीज', 'ओके', 'कम ऑन', 'लेट्स गो', 'बॉस', 'गाइज', 'डेंजरस', 'मिस', 'कॉल', 'मैसेज', 'फोन', 'टीम'.
                  4. Output ONLY a valid JSON array of objects:
                     [{"text": "अनुवादित हिंदी संवाद।", "speaker": "man"}]
                  No explanation, no markdown backticks, only pure JSON.
                  """.trimIndent()

                  try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 10000
                          readTimeout = 20000
                          doOutput = true
                      }

                      val payload = JSONObject().apply {
                          put("model", "llama-3.1-8b-instant")
                          val msgs = JSONArray().apply {
                              put(JSONObject().apply { put("role", "system"); put("content", systemPrompt) })
                              put(JSONObject().apply { put("role", "user"); put("content", jsonArr.toString()) })
                          }
                          put("messages", msgs)
                          put("temperature", 0.15)
                      }
                      conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val content = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                          val cleanJson = if (content.contains("[")) content.substring(content.indexOf("["), content.lastIndexOf("]") + 1) else content
                          val arr = JSONArray(cleanJson)
                          val result = mutableListOf<Pair<String, String>>()
                          for (i in 0 until arr.length()) {
                              val item = arr.optJSONObject(i)
                              if (item != null) {
                                  result.add(item.optString("text", "") to item.optString("speaker", "man").lowercase())
                              } else {
                                  result.add(arr.getString(i) to "man")
                              }
                          }
                          if (result.isNotEmpty()) return result
                      }
                  } catch (_: Exception) {}

                  return emptyList()
              }

              private fun cleanDialogue(raw: String): String {
                  var res = raw.trim().replace(Regex("[*\"#_`~]"), " ")
                  res = res.replace("...", " ")
                  res = res.replace("..", " ")
                  res = res.replace(".", "। ")
                  res = res.replace("!", "। ")
                  res = res.replace("?", "। ")
                  res = res.replace(",", " ")
                  res = res.replace(";", " ")
                  res = res.replace(":", " ")
                  res = res.replace(Regex("(?i)\\b(dot|comma|point|dash)\\b"), " ")
                  res = res.replace(Regex("\\b(डॉट|कॉमा|पॉइंट|डैश)\\b"), " ")
                  res = res.replace(Regex("।+"), "।")
                  return res.replace(Regex("\\s+"), " ").trim()
              }

              private fun speakDubbed(text: String, speakerType: String) {
                  applyCharacterVoice(speakerType)
                  val volFloat = (volumeSeekBar.progress / 100f).coerceIn(0f, 1f)
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                      putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, volFloat)
                  }
                  isSpeechActive.set(true)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "dub_${System.currentTimeMillis()}")
              }

              private fun applyCharacterVoice(speakerType: String) {
                  val effectiveRole = if (voiceTypeIndex == 0) {
                      speakerType.lowercase()
                  } else {
                      when (voiceTypeIndex) {
                          1 -> "man"
                          2 -> "woman"
                          3 -> "boy"
                          4 -> "girl"
                          else -> "man"
                      }
                  }

                  val isFemale = effectiveRole == "woman" || effectiveRole == "girl"
                  if (isFemale && cachedFemaleVoice != null) tts?.voice = cachedFemaleVoice
                  else if (cachedMaleVoice != null) tts?.voice = cachedMaleVoice

                  tts?.setPitch(1.0f)
                  tts?.setSpeechRate(1.06f * currentPlaybackSpeed)
              }

              private fun resolveStudioVoices() {
                  try {
                      val voices = tts?.voices ?: emptySet()
                      val targetVoices = voices.filter {
                          it.locale.language.equals(targetLangCode, ignoreCase = true) ||
                          it.locale.toLanguageTag().startsWith(targetLangCode, ignoreCase = true)
                      }

                      val maleCandidates = targetVoices.filter { v ->
                          val n = v.name.lowercase()
                          n.contains("hid") || n.contains("hie") || n.contains("male") || n.contains("man") || n.contains("d-") || n.contains("e-")
                      }

                      val femaleCandidates = targetVoices.filter { v ->
                          val n = v.name.lowercase()
                          n.contains("hic") || n.contains("hia") || n.contains("female") || n.contains("woman") || n.contains("a-") || n.contains("c-")
                      }

                      fun selectFinest(list: List<Voice>): Voice? {
                          return list.maxByOrNull { v ->
                              var score = 0
                              val n = v.name.lowercase()
                              if (v.isNetworkConnectionRequired || n.contains("network")) score += 120
                              if (n.contains("neural2")) score += 90
                              if (n.contains("wavenet")) score += 70
                              if (n.contains("x-")) score += 30
                              if (v.quality >= Voice.QUALITY_VERY_HIGH) score += 40
                              else if (v.quality >= Voice.QUALITY_HIGH) score += 20
                              score
                          } ?: list.firstOrNull()
                      }

                      cachedMaleVoice = selectFinest(maleCandidates) ?: targetVoices.firstOrNull()
                      cachedFemaleVoice = selectFinest(femaleCandidates) ?: cachedMaleVoice

                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      tts?.setLanguage(Locale(targetLangCode, "IN"))
                      resolveStudioVoices()
                      applyCharacterVoice("man")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                          tts?.setAudioAttributes(attrs)
                      }

                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(id: String?) { isSpeechActive.set(true) }
                          override fun onDone(id: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.postDelayed({ if (!isSpeechActive.get()) playerSubtitleText.text = "" }, 200)
                          }
                          override fun onError(id: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.post { playerSubtitleText.text = "" }
                          }
                      })
                  }
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun dpToPx(dp: Int): Int = (dp * resources.displayMetrics.density).toInt()

              private fun createRoundedDrawable(bgColor: Int, cornerRadius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      setColor(bgColor)
                      this.cornerRadius = cornerRadius
                  }
              }

              private fun createCardDrawable(bgColor: Int, strokeColor: Int, cornerRadius: Float, strokeWidth: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      setColor(bgColor)
                      this.cornerRadius = cornerRadius
                      setStroke(strokeWidth, strokeColor)
                  }
              }

              override fun onBackPressed() {
                  if (isFullscreen) {
                      toggleFullscreen()
                  } else if (activeTab != 0) {
                      showScreen(0)
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
