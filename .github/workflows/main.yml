              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      tts?.setLanguage(Locale(targetLangCode, "IN"))
                      resolveStudioVoices()
                      applyCharacterVoice("man")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val attrs = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                          tts?.setAudioAttributes(attrs)
                      }

                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(id: String?) { isSpeechActive.set(true) }
                          override fun onDone(id: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.postDelayed({ if (!isSpeechActive.get()) playerSubtitleText.text = "" }, 200)
                          }
                          override fun onError(id: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.post { playerSubtitleText.text = "" }
                          }
                      })
                  } else {
                      showDebugError("TTS Init Failure Code: $initStatus")
                  }
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun dpToPx(dp: Int): Int = (dp * resources.displayMetrics.density).toInt()

              private fun createRoundedDrawable(bgColor: Int, cornerRadius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      setColor(bgColor)
                      this.cornerRadius = cornerRadius
                  }
              }

              private fun createCardDrawable(bgColor: Int, strokeColor: Int, cornerRadius: Float, strokeWidth: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      setColor(bgColor)
                      this.cornerRadius = cornerRadius
                      setStroke(strokeWidth, strokeColor)
                  }
              }

              override fun onBackPressed() {
                  if (isFullscreen) {
                      toggleFullscreen()
                  } else if (activeTab != 0) {
                      showScreen(0)
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  saveCurrentPosition()
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
