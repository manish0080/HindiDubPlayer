name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Fix AGP 9 & Build Settings
        run: |
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Replace MainActivity With Full Audio Extraction
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

          cat << 'EOF' > "$MAIN"
          package PACKAGE_NAME

          import android.app.Activity
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import java.io.File
          import java.nio.ByteBuffer

          class MainActivity : Activity() {

              private lateinit var videoView: VideoView
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(24, 24, 24, 24)
                  }

                  val title = TextView(this).apply {
                      text = "HindiDubPlayer"
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }
                  layout.addView(title)

                  val button = Button(this).apply {
                      text = "Select Video"
                  }
                  layout.addView(button)

                  status = TextView(this).apply {
                      text = "Select an English video"
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 16)
                  }
                  layout.addView(status)

                  videoView = VideoView(this)
                  val videoParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0
                  ).apply {
                      weight = 1f
                      topMargin = 20
                  }
                  layout.addView(videoView, videoParams)

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  button.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "video/*"
                      }
                      startActivityForResult(intent, 100)
                  }

                  setContentView(layout)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return

                      videoView.setVideoURI(uri)
                      videoView.start()

                      status.text = "Extracting original audio..."

                      Thread {
                          val outputFile = extractAudio(uri)

                          runOnUiThread {
                              if (outputFile != null && outputFile.exists() && outputFile.length() > 0) {
                                  val sizeMb = outputFile.length().toDouble() / (1024.0 * 1024.0)
                                  status.text = "Audio Extracted ✓\nSize: %.2f MB".format(sizeMb)
                                  Toast.makeText(this, "Audio ready for AI pipeline!", Toast.LENGTH_SHORT).show()
                              } else {
                                  status.text = "Audio extraction failed"
                              }
                          }
                      }.start()
                  }
              }

              private fun extractAudio(uri: Uri): File? {
                  val extractor = MediaExtractor()
                  try {
                      contentResolver.openFileDescriptor(uri, "r")?.use { pfd ->
                          extractor.setDataSource(pfd.fileDescriptor)
                      } ?: return null

                      var audioTrack = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrack = i
                              audioFormat = format
                              break
                          }
                      }

                      if (audioTrack < 0 || audioFormat == null) {
                          extractor.release()
                          return null
                      }

                      extractor.selectTrack(audioTrack)

                      val outputFile = File(cacheDir, "extracted_audio.m4a")
                      if (outputFile.exists()) outputFile.delete()

                      val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      val muxerTrack = muxer.addTrack(audioFormat)
                      muxer.start()

                      val buffer = ByteBuffer.allocate(1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()

                      while (true) {
                          val sampleSize = extractor.readSampleData(buffer, 0)
                          if (sampleSize < 0) break

                          bufferInfo.offset = 0
                          bufferInfo.size = sampleSize
                          bufferInfo.presentationTimeUs = extractor.sampleTime
                          bufferInfo.flags = extractor.sampleFlags

                          muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                          extractor.advance()
                      }

                      muxer.stop()
                      muxer.release()
                      extractor.release()

                      return outputFile
                  } catch (e: Exception) {
                      e.printStackTrace()
                      extractor.release()
                      return null
                  }
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity successfully updated with package $PACKAGE"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
