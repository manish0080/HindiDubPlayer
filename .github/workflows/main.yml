name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Add Internet Permission & Build Fixes
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Replace MainActivity With Proportioned Speed Dubber
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

          cat << 'EOF' > "$MAIN"
          package PACKAGE_NAME

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaPlayer
          import android.media.PlaybackParams
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.DataOutputStream
