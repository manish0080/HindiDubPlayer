              private fun queryDeviceVideos(): List<VideoDeviceItem> {
                  val list = mutableListOf<VideoDeviceItem>()
                  try {
                      val projection = arrayOf(
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.DISPLAY_NAME,
                          MediaStore.Video.Media.SIZE,
                          MediaStore.Video.Media.DURATION
                      )
                      val cursor: Cursor? = contentResolver.query(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          projection, null, null,
                          "${MediaStore.Video.Media.DATE_ADDED} DESC"
                      )
                      cursor?.use {
                          val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                          val sizeCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                          val durCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)

                          var count = 0
                          while (it.moveToNext() && count < 25) {
                              val id = it.getLong(idCol)
                              val name = it.getString(nameCol) ?: "Video.mp4"
                              val size = it.getLong(sizeCol)
                              val dur = it.getLong(durCol)
                              val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                              val sizeStr = String.format("%.1f MB", size / (1024.0 * 1024.0))
                              val durStr = formatTime(dur)
                              list.add(VideoDeviceItem(uri, name, sizeStr, durStr))
                              count++
                          }
                      }
                  } catch (e: Exception) {
                      showDebugError("Device Video Query Exception: ${e.message}")
                  }
                  return list
              }

