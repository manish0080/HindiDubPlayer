name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract project
        run: |
          unzip -q HindiDubPlayer-starter.zip
          ls -la HindiDubPlayer

      - name: Fix Kotlin for AGP 9
        run: |
          sed -i '/kotlin.android/d' HindiDubPlayer/app/build.gradle.kts
          sed -i '/kotlinOptions {/,/}/d' HindiDubPlayer/app/build.gradle.kts

      - name: Replace MainActivity
        run: |
          MAIN=$(find HindiDubPlayer/app/src/main/java -name MainActivity.kt | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //')

          cat > "$MAIN" <<EOF
          package $PACKAGE

          import android.app.Activity
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.VideoView
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.nio.ByteBuffer

          class MainActivity : Activity() {

              private lateinit var videoView: VideoView
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.gravity = Gravity.CENTER_HORIZONTAL
                  layout.setPadding(24, 24, 24, 24)

                  val title = TextView(this)
                  title.text = "HindiDubPlayer"
                  title.textSize = 24f
                  title.gravity = Gravity.CENTER
                  layout.addView(title)

                  val button = Button(this)
                  button.text = "Select Video"
                  layout.addView(button)

                  status = TextView(this)
                  status.text = "Select an English video"
                  status.textSize = 16f
                  layout.addView(status)

                  videoView = VideoView(this)

                  val videoParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0
                  )
                  videoParams.weight = 1f
                  videoParams.topMargin = 20
                  layout.addView(videoView, videoParams)

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  button.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      intent.addCategory(Intent.CATEGORY_OPENABLE)
                      intent.type = "video/*"
                      startActivityForResult(intent, 100)
                  }

                  setContentView(layout)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return

                      videoView.setVideoURI(uri)
                      videoView.start()

                      status.text = "Extracting original audio..."

                      Thread {
                          val output = extractAudio(uri)

                          runOnUiThread {
                              if (output != null && output.exists() && output.length() > 44) {
                                  val sizeMb =
                                      output.length().toDouble() / (1024.0 * 1024.0)

                                  status.text =
                                      "Audio extracted ✓\\n" +
                                      "WAV: %.2f MB".format(sizeMb)
                              } else {
                                  status.text = "Audio extraction failed"
                              }
                          }
                      }.start()
                  }
              }

              private fun extractAudio(uri: Uri): File? {
                  val extractor = MediaExtractor()

                  try {
                      extractor.setDataSource(this, uri, null)

                      var audioTrack = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""

                          if (mime.startsWith("audio/")) {
                              audioTrack = i
                              audioFormat = format
                              break
                          }
                      }

                      if (audioTrack < 0 || audioFormat == null) {
                          extractor.release()
                          return null
                      }

                      extractor.selectTrack(audioTrack)

                      val mime =
                          audioFormat.getString(MediaFormat.KEY_MIME) ?: return null

                      val sampleRate =
                          if (audioFormat.containsKey(MediaFormat.KEY_SAMPLE_RATE))
                              audioFormat.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                          else
                              44100

                      val channels
