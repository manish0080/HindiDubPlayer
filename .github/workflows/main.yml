                      type = "video/*"
                  }
                  startActivityForResult(intent, 100)
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun saveCurrentPosition() {
                  val uri = selectedVideoUri ?: return
                  val pos = videoView.currentPosition
                  if (pos > 3000) {
                      getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                          .putInt("POS_" + uri.toString().hashCode(), pos)
                          .apply()
                  }
              }

              private fun applyVideoPlaybackSpeed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          mediaPlayerRef?.let { mp ->
                              val params = mp.playbackParams ?: PlaybackParams()
                              val adjustedVideoSpeed = (currentPlaybackSpeed * 0.96f).coerceIn(0.5f, 2.5f)
                              params.speed = adjustedVideoSpeed
                              mp.playbackParams = params
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

