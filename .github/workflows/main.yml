              private fun populateDeviceVideos() {
                  browserListContainer.removeAllViews()
                  val videos = queryDeviceVideos()

                  if (videos.isNotEmpty()) {
                      videos.forEach { video ->
                          val row = createVideoListItem(video.title, "${video.sizeText} • ${video.durationText}", video.uri)
                          browserListContainer.addView(row)
                      }
                  } else {
                      val emptyMsg = TextView(this).apply {
                          text = "फ़ोन में कोई वीडियो नहीं मिला। गैलरी से चुनने के लिए नीचे दिए गए बटन पर टैप करें।"
