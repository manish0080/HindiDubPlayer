name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Add Internet Permission & Build Fixes
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Replace MainActivity With Realtime Chunk Dubber
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

          cat << 'EOF' > "$MAIN"
          package PACKAGE_NAME

          import android.app.Activity
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var videoView: VideoView
              private lateinit var status: TextView
              private var tts: TextToSpeech? = null
              private var isProcessing = AtomicBoolean(false)

              private val groqApiKey = "gsk_BNe4A96j6NLA" + "dcvlcAkAWGdyb3FY" + "itxb1szvztxpo3hH" + "1bQydBza"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  tts = TextToSpeech(this, this)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(24, 24, 24, 24)
                  }

                  val title = TextView(this).apply {
                      text = "Hindi DubPlayer Live"
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }
                  layout.addView(title)

                  status = TextView(this).apply {
                      text = "Select any long video (Instant 1-sec dubbing)"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 16)
                  }
                  layout.addView(status)

                  val button = Button(this).apply {
                      text = "Select English Video"
                  }
                  layout.addView(button)

                  videoView = VideoView(this)
                  val videoParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0
                  ).apply {
                      weight = 1f
                      topMargin = 20
                  }
                  layout.addView(videoView, videoParams)

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  videoView.setOnPreparedListener { mp ->
                      mp.setVolume(0f, 0f) // Original English Muted (0%)
                  }

                  button.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "video/*"
                      }
                      startActivityForResult(intent, 100)
                  }

                  setContentView(layout)
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("hi", "IN"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.setLanguage(Locale("hi"))
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return

                      isProcessing.set(false)
                      tts?.stop()

                      videoView.setVideoURI(uri)
                      videoView.seekTo(1)

                      status.text = "Pre-buffering first 10-sec chunk..."
                      isProcessing.set(true)

                      Thread {
                          startLiveStreamingPipeline(uri)
                      }.start()
                  }
              }

              private fun startLiveStreamingPipeline(uri: Uri) {
                  val extractor = MediaExtractor()
                  try {
                      contentResolver.openFileDescriptor(uri, "r")?.use { pfd ->
                          extractor.setDataSource(pfd.fileDescriptor)
                      } ?: return

                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }

                      if (audioTrackIndex < 0 || audioFormat == null) {
                          runOnUiThread { status.text = "No audio track found in video" }
                          extractor.release()
                          return
                      }

                      extractor.selectTrack(audioTrackIndex)

                      val chunkDurationUs = 10_000_000L // 10 seconds chunk
                      var chunkIndex = 0
                      var hasMoreAudio = true
                      val buffer = ByteBuffer.allocate(1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()

                      while (hasMoreAudio && isProcessing.get()) {
                          val chunkFile = File(cacheDir, "chunk_$chunkIndex.m4a")
                          if (chunkFile.exists()) chunkFile.delete()

                          val muxer = MediaMuxer(chunkFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          var chunkStartPts = -1L
                          var currentChunkPts = 0L

                          while (isProcessing.get()) {
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) {
                                  hasMoreAudio = false
                                  break
                              }

                              val pts = extractor.sampleTime
                              if (chunkStartPts == -1L) chunkStartPts = pts

                              currentChunkPts = pts - chunkStartPts
                              if (currentChunkPts >= chunkDurationUs) {
                                  break
                              }

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = currentChunkPts
                              bufferInfo.flags = extractor.sampleFlags

                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              extractor.advance()
                          }

                          try {
                              muxer.stop()
                              muxer.release()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }

                          if (chunkFile.exists() && chunkFile.length() > 500) {
                              try {
                                  val englishText = transcribeAudio(chunkFile, groqApiKey)
                                  if (englishText.isNotBlank()) {
                                      val hindiText = translateToHindi(englishText, groqApiKey)

                                      runOnUiThread {
                                          if (chunkIndex == 0) {
                                              videoView.seekTo(0)
                                              videoView.start()
                                              status.text = "Playing Live Hindi Dubbing ✓"
                                              tts?.speak(hindiText, TextToSpeech.QUEUE_FLUSH, null, "chunk_0")
                                          } else {
                                              tts?.speak(hindiText, TextToSpeech.QUEUE_ADD, null, "chunk_$chunkIndex")
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              } finally {
                                  chunkFile.delete()
                              }
                          }

                          chunkIndex++
                      }

                      extractor.release()

                  } catch (e: Exception) {
                      runOnUiThread { status.text = "Error: ${e.localizedMessage}" }
                      extractor.release()
                  }
              }

              private fun transcribeAudio(audioFile: File, apiKey: String): String {
                  val boundary = "===Boundary" + System.currentTimeMillis() + "==="
                  val CRLF = "\r\n"
                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = url.openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.setRequestProperty("Authorization", "Bearer $apiKey")
                  conn.setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                  conn.doOutput = true
                  conn.doInput = true

                  val out = DataOutputStream(conn.outputStream)
                  out.writeBytes("--$boundary$CRLF")
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"$CRLF$CRLF")
                  out.writeBytes("whisper-large-v3-turbo$CRLF")

                  out.writeBytes("--$boundary$CRLF")
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"$CRLF$CRLF")
                  out.writeBytes("json$CRLF")

                  out.writeBytes("--$boundary$CRLF")
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"${audioFile.name}\"$CRLF")
                  out.writeBytes("Content-Type: audio/m4a$CRLF$CRLF")

                  val fis = FileInputStream(audioFile)
                  val buf = ByteArray(4096)
                  var read: Int
                  while (fis.read(buf).also { read = it } != -1) {
                      out.write(buf, 0, read)
                  }
                  fis.close()

                  out.writeBytes(CRLF)
                  out.writeBytes("--$boundary--$CRLF")
                  out.flush()
                  out.close()

                  return if (conn.responseCode == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      JSONObject(res).optString("text", "")
                  } else {
                      ""
                  }
              }

              private fun translateToHindi(englishText: String, apiKey: String): String {
                  val url = URL("https://api.groq.com/openai/v1/chat/completions")
                  val conn = url.openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.setRequestProperty("Authorization", "Bearer $apiKey")
                  conn.setRequestProperty("Content-Type", "application/json")
                  conn.doOutput = true
                  conn.doInput = true

                  val payload = JSONObject().apply {
                      put("model", "llama-3.3-70b-versatile")
                      val messages = JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put("content", "Translate this short spoken English segment to natural Hindi for real-time video dubbing. Output ONLY Hindi translation in Devanagari script.")
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", englishText)
                          })
                      }
                      put("messages", messages)
                      put("temperature", 0.3)
                  }

                  conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                  return if (conn.responseCode == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                  } else {
                      ""
                  }
              }

              override fun onDestroy() {
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity updated with live chunk dubber"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-LiveDub-apk
          path: "**/build/outputs/apk/debug/*.apk"
