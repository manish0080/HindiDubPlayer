              private fun setTtsLocale(code: String) {
                  val loc = if (code == "hi") Locale("hi", "IN") else Locale(code)
                  val res = tts?.setLanguage(loc)
                  if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.setLanguage(Locale(code))
                  }
              }

              private fun applyCharacterVoice(speakerType: String) {
                  try {
                      val voices = tts?.voices ?: emptySet()
                      val langVoices = voices.filter { it.locale.language.equals(targetLangCode, ignoreCase = true) }
                      val maleVoice = langVoices.firstOrNull { it.name.contains("male", true) || it.name.contains("man", true) }
                      val femaleVoice = langVoices.firstOrNull { it.name.contains("female", true) || it.name.contains("woman", true) }

                      val effectiveRole = if (voiceTypeIndex == 0) speakerType.lowercase() else when (voiceTypeIndex) {
                          1 -> "man"
                          2 -> "woman"
                          3 -> "boy"
                          4 -> "girl"
                          else -> "man"
                      }

                      var basePitch = 1.0f
                      var baseRate = 1.06f

                      when (effectiveRole) {
                          "boy" -> { if (maleVoice != null) tts?.voice = maleVoice; basePitch = 1.28f; baseRate = 1.08f }
                          "girl" -> { if (femaleVoice != null) tts?.voice = femaleVoice; basePitch = 1.42f; baseRate = 1.05f }
                          "woman" -> { if (femaleVoice != null) tts?.voice = femaleVoice; basePitch = 1.05f; baseRate = 1.06f }
                          else -> { if (maleVoice != null) tts?.voice = maleVoice; basePitch = 0.78f; baseRate = 1.08f }
                      }

                      tts?.setPitch(basePitch)
                      tts?.setSpeechRate(baseRate * currentPlaybackSpeed)
                  } catch (_: Exception) {}
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      setTtsLocale(targetLangCode)
                      applyCharacterVoice("man")
                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) { isSpeechActive.set(true) }
                          override fun onDone(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.postDelayed({ if (!isSpeechActive.get()) fullscreenSubtitleView.text = "" }, 250)
                          }
                          override fun onError(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.post { fullscreenSubtitleView.text = "" }
                          }
                      })
                  }
              }

