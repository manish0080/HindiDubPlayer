name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Add Internet Permission & Build Fixes
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Replace MainActivity With Auto Model Dubber
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

          cat << 'EOF' > "$MAIN"
          package PACKAGE_NAME

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var videoView: VideoView
              private lateinit var statusText: TextView
              private lateinit var errorBox: TextView
              private lateinit var centerStartBtn: Button
              private var selectedVideoUri: Uri? = null

              private var tts: TextToSpeech? = null
              private var pfd: ParcelFileDescriptor? = null
              private val isProcessing = AtomicBoolean(false)
              private var lastErrorDetails = "No error recorded yet."
              private var processedSegments = 0
              private var detectedChatModel: String? = null

              private val groqApiKey = "gsk_BNe4A96j6NLA" + "dcvlcAkAWGdyb3FY" + "itxb1szvztxpo3hH" + "1bQydBza"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  volumeControlStream = AudioManager.STREAM_MUSIC
                  tts = TextToSpeech(this, this)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 16, 16, 16)
                  }

                  // Header with settings menu
                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val titleView = TextView(this).apply {
                      text = "Hindi DubPlayer Live"
                      textSize = 20f
                      setTextColor(Color.BLACK)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  headerLayout.addView(titleView)

                  val menuBtn = Button(this).apply {
                      text = "⚙️ Menu"
                      textSize = 12f
                      setOnClickListener { showSettingsDialog() }
                  }
                  headerLayout.addView(menuBtn)
                  rootLayout.addView(headerLayout)

                  // Select Video Button
                  val selectBtn = Button(this).apply {
                      text = "📁 Select English Video"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "video/*"
                          }
                          startActivityForResult(intent, 100)
                      }
                  }
                  rootLayout.addView(selectBtn)

                  // Status Text
                  statusText = TextView(this).apply {
                      text = "Step 1: Select an English video"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 8)
                  }
                  rootLayout.addView(statusText)

                  // Persistent Error Box
                  errorBox = TextView(this).apply {
                      text = ""
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#B00020"))
                      setPadding(16, 12, 16, 12)
                      visibility = View.GONE
                  }
                  rootLayout.addView(errorBox)

                  // Video Container with Center Button
                  val videoContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }

                  videoView = VideoView(this)
                  videoContainer.addView(videoView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  videoView.setOnPreparedListener { mp ->
                      mp.setVolume(0f, 0f) // Mute original English
                  }

                  // Center Translation ON Button
                  centerStartBtn = Button(this).apply {
                      text = "▶ START HINDI DUBBING"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setPadding(24, 16, 24, 16)
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                      setOnClickListener {
                          val uri = selectedVideoUri ?: return@setOnClickListener
                          visibility = View.GONE
                          errorBox.visibility = View.GONE
                          startDubbingProcess(uri)
                      }
                  }
                  videoContainer.addView(centerStartBtn)
                  rootLayout.addView(videoContainer)

                  setContentView(rootLayout)
              }

              private fun showSettingsDialog() {
                  val activeModel = detectedChatModel ?: "Detecting..."
                  val options = arrayOf(
                      "Active AI Model: $activeModel",
                      "Processed: $processedSegments chunks",
                      "View Last Error Details",
                      "Stop Current Dubbing"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("⚙️ DubPlayer Settings")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> Toast.makeText(this, "Model: $activeModel", Toast.LENGTH_SHORT).show()
                              1 -> Toast.makeText(this, "Processed: $processedSegments parts", Toast.LENGTH_SHORT).show()
                              2 -> {
                                  AlertDialog.Builder(this)
                                      .setTitle("Last Error Info")
                                      .setMessage(lastErrorDetails)
                                      .setPositiveButton("OK", null)
                                      .show()
                              }
                              3 -> {
                                  isProcessing.set(false)
                                  tts?.stop()
                                  videoView.pause()
                                  statusText.text = "Dubbing Stopped."
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("hi", "IN"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.setLanguage(Locale("hi"))
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      selectedVideoUri = uri

                      isProcessing.set(false)
                      tts?.stop()
                      errorBox.visibility = View.GONE

                      videoView.setVideoURI(uri)
                      videoView.seekTo(1)

                      statusText.text = "Video loaded! Tap 'START HINDI DUBBING' to begin."
                      centerStartBtn.visibility = View.VISIBLE
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  processedSegments = 0
                  statusText.text = "Auto-detecting available Groq model..."

                  Thread {
                      startLiveStreamingPipeline(uri)
                  }.start()
              }

              private fun getAvailableChatModel(apiKey: String): String {
                  detectedChatModel?.let { return it }

                  try {
                      val url = URL("https://api.groq.com/openai/v1/models")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          connectTimeout = 8000
                          readTimeout = 8000
                          doInput = true
                      }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val data = JSONObject(res).optJSONArray("data")
                          if (data != null && data.length() > 0) {
                              val available = mutableListOf<String>()
                              for (i in 0 until data.length()) {
                                  val id = data.getJSONObject(i).optString("id", "")
                                  if (id.isNotBlank() && !id.contains("whisper", ignoreCase = true)) {
                                      available.add(id)
                                  }
                              }

                              // Auto-select the best matching model present in user's account
                              val selected = available.firstOrNull { it.contains("llama-3", ignoreCase = true) }
                                  ?: available.firstOrNull { it.contains("llama3", ignoreCase = true) }
                                  ?: available.firstOrNull { it.contains("mixtral", ignoreCase = true) }
                                  ?: available.firstOrNull { it.contains("gemma", ignoreCase = true) }
                                  ?: available.firstOrNull { it.contains("qwen", ignoreCase = true) }
                                  ?: available.firstOrNull()

                              if (selected != null) {
                                  detectedChatModel = selected
                                  return selected
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  // Default safe fallback if network check drops
                  val fallback = "llama3-8b-8192"
                  detectedChatModel = fallback
                  return fallback
              }

              private fun startLiveStreamingPipeline(uri: Uri) {
                  val extractor = MediaExtractor()
                  try {
                      pfd?.close()
                      pfd = contentResolver.openFileDescriptor(uri, "r")
                      val descriptor = pfd?.fileDescriptor
                      if (descriptor == null) {
                          showError("Cannot access video file stream")
                          return
                      }

                      extractor.setDataSource(descriptor)

                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }

                      if (audioTrackIndex < 0 || audioFormat == null) {
                          showError("No audio track detected in this video!")
                          extractor.release()
                          return
                      }

                      extractor.selectTrack(audioTrackIndex)

                      // Discover active model for user's key
                      val activeModel = getAvailableChatModel(groqApiKey)
                      runOnUiThread {
                          statusText.text = "Connected to Groq Model: $activeModel\nReading audio..."
                      }

                      val chunkDurationUs = 10_000_000L // 10 seconds per chunk
                      var chunkIndex = 0
                      var hasMoreAudio = true
                      val buffer = ByteBuffer.allocate(1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()

                      while (hasMoreAudio && isProcessing.get()) {

                          // PACING: Sync with playback
                          if (chunkIndex > 1) {
                              while (isProcessing.get() && videoView.isPlaying) {
                                  val currentPosMs = videoView.currentPosition
                                  val chunkStartMs = (chunkIndex - 1) * 10_000L
                                  if (currentPosMs >= chunkStartMs) {
                                      break
                                  }
                                  Thread.sleep(400)
                              }
                          }

                          val currentChunkNum = chunkIndex + 1
                          val chunkFile = File(cacheDir, "chunk_$chunkIndex.m4a")
                          if (chunkFile.exists()) chunkFile.delete()

                          val muxer = MediaMuxer(chunkFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          var chunkStartPts = -1L
                          var lastPts = 0L
                          var samplesWritten = 0

                          while (isProcessing.get()) {
                              buffer.clear()
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) {
                                  hasMoreAudio = false
                                  break
                              }

                              val rawPts = extractor.sampleTime
                              if (chunkStartPts == -1L) chunkStartPts = rawPts

                              var relativePts = rawPts - chunkStartPts
                              if (relativePts <= lastPts) {
                                  relativePts = lastPts + 20_000L
                              }
                              lastPts = relativePts

                              if (relativePts >= chunkDurationUs) {
                                  break
                              }

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = relativePts
                              bufferInfo.flags = extractor.sampleFlags

                              buffer.position(0)
                              buffer.limit(sampleSize)

                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              samplesWritten++
                              extractor.advance()
                          }

                          try {
                              if (samplesWritten > 0) muxer.stop()
                              muxer.release()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }

                          if (chunkFile.exists() && chunkFile.length() > 500) {
                              try {
                                  runOnUiThread {
                                      statusText.text = "Transcribing Part $currentChunkNum..."
                                  }

                                  val englishText = transcribeAudio(chunkFile, groqApiKey)

                                  if (englishText.isNotBlank()) {
                                      runOnUiThread {
                                          statusText.text = "Translating with $activeModel..."
                                      }

                                      val hindiText = translateToHindi(englishText, activeModel, groqApiKey)

                                      runOnUiThread {
                                          processedSegments++
                                          if (chunkIndex == 0) {
                                              videoView.seekTo(0)
                                              videoView.start()
                                              statusText.text = "Hindi Dubbing Active ✓ [$activeModel]\n\n$hindiText"
                                              speakHindi(hindiText, true)
                                          } else {
                                              statusText.text = "Dubbing (Part $currentChunkNum) ✓\n\n$hindiText"
                                              speakHindi(hindiText, false)
                                          }
                                      }
                                  } else {
                                      if (chunkIndex == 0) {
                                          runOnUiThread {
                                              videoView.seekTo(0)
                                              videoView.start()
                                              statusText.text = "Playing video (Listening for dialogue...)"
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  showError("Part $currentChunkNum: ${e.localizedMessage}")
                                  isProcessing.set(false)
                                  break
                              } finally {
                                  chunkFile.delete()
                              }
                          }

                          chunkIndex++
                      }

                      extractor.release()

                  } catch (e: Exception) {
                      showError("Playback Error: ${e.localizedMessage}")
                      try { extractor.release() } catch (_: Exception) {}
                  }
              }

              private fun showError(msg: String) {
                  lastErrorDetails = msg
                  runOnUiThread {
                      errorBox.text = "⚠️ $msg\n(Tap ⚙️ Menu for info)"
                      errorBox.visibility = View.VISIBLE
                      statusText.text = "Dubbing Paused on Error"
                      centerStartBtn.visibility = View.VISIBLE
                  }
              }

              private fun speakHindi(text: String, flush: Boolean) {
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  val mode = if (flush) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                  tts?.speak(text, mode, params, "dub_${System.currentTimeMillis()}")
              }

              private fun transcribeAudio(audioFile: File, apiKey: String): String {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val lineEnd = "\r\n"
                  val twoHyphens = "--"

                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer " + apiKey)
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary)
                      connectTimeout = 12000
                      readTimeout = 20000
                      doOutput = true
                      doInput = true
                  }

                  val out = DataOutputStream(conn.outputStream)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"" + lineEnd + lineEnd)
                  out.writeBytes("whisper-large-v3-turbo" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"" + lineEnd + lineEnd)
                  out.writeBytes("json" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                  out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var bytesRead: Int
                      while (fis.read(buf).also { bytesRead = it } != -1) {
                          out.write(buf, 0, bytesRead)
                      }
                  }

                  out.writeBytes(lineEnd)
                  out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                  out.flush()
                  out.close()

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).optString("text", "").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Whisper: $err")
                  }
              }

              private fun translateToHindi(englishText: String, modelName: String, apiKey: String): String {
                  val url = URL("https://api.groq.com/openai/v1/chat/completions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer " + apiKey)
                      setRequestProperty("Content-Type", "application/json")
                      connectTimeout = 12000
                      readTimeout = 20000
                      doOutput = true
                      doInput = true
                  }

                  val payload = JSONObject().apply {
                      put("model", modelName)
                      val messages = JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put("content", "You are an expert anime voice dubber. Translate the spoken English dialogue into natural Hindi. Output ONLY the Hindi translation in Devanagari script. No English words or notes.")
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", englishText)
                          })
                      }
                      put("messages", messages)
                      put("temperature", 0.2)
                  }

                  conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Llama ($modelName): $err")
                  }
              }

              override fun onDestroy() {
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  pfd?.close()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity updated with Auto Model Discovery"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-AutoModel-apk
          path: "**/build/outputs/apk/debug/*.apk"
