                      tts?.stop()
                      isSpeechActive.set(false)
                      saveCurrentPosition()
                      statusBadge.text = "Paused"
                  } else {
                      mediaPlayerRef?.setVolume(0f, 0f)
                      applyVideoPlaybackSpeed()
                      videoView.start()
                      statusBadge.text = "Playing"
                  }
              }

              private fun toggleFullscreen() {
                  isFullscreen = !isFullscreen
                  if (isFullscreen) {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN)
                      mainScrollView.visibility = View.GONE
                      videoContainer.layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT)
                      fullscreenSubtitleView.visibility = View.VISIBLE
                      fullscreenBtn.text = "⤓"
                  } else {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                      mainScrollView.visibility = View.VISIBLE
                      videoContainer.layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(225))
                      fullscreenSubtitleView.visibility = View.GONE
                      fullscreenBtn.text = "⛶"
