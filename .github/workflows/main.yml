              private fun cycleSpeedToggle() {
                  val speeds = floatArrayOf(1.0f, 1.25f, 1.5f, 2.0f)
                  var nextIdx = 0
                  for (i in speeds.indices) {
                      if (currentPlaybackSpeed == speeds[i]) {
                          nextIdx = (i + 1) % speeds.size
                          break
                      }
                  }
                  currentPlaybackSpeed = speeds[nextIdx]
                  homeSpeedBtn.text = "⚡ ${currentPlaybackSpeed}x"
                  getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                      .putFloat("PLAY_SPEED", currentPlaybackSpeed)
                      .apply()

                  applyVideoPlaybackSpeed()
                  Toast.makeText(this, "Speed: ${currentPlaybackSpeed}x", Toast.LENGTH_SHORT).show()
              }

              private fun setupWindowInsetsAdapter() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT_WATCH) {
                      rootFrame.setOnApplyWindowInsetsListener { _, insets ->
                          systemStatusBarHeight = insets.systemWindowInsetTop

                          if (!isFullscreen) {
                              rootFrame.setPadding(0, systemStatusBarHeight, 0, 0)
                              topBarOverlay.setPadding(dpToPx(12), dpToPx(6), dpToPx(12), dpToPx(6))
                              bottomControlsBar.setPadding(dpToPx(14), dpToPx(4), dpToPx(12), dpToPx(6))
                          } else {
                              rootFrame.setPadding(0, 0, 0, 0)
                              val cutoutLeft = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) insets.displayCutout?.safeInsetLeft ?: 0 else 0
                              val cutoutRight = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) insets.displayCutout?.safeInsetRight ?: 0 else 0
                              val padLeft = Math.max(cutoutLeft, dpToPx(16))
                              val padRight = Math.max(cutoutRight, dpToPx(16))

                              topBarOverlay.setPadding(padLeft, dpToPx(10), padRight, dpToPx(8))
                              bottomControlsBar.setPadding(padLeft, dpToPx(6), padRight, dpToPx(12))
                          }
                          insets
                      }
                  }
              }

