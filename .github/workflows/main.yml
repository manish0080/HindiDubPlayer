name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unzip Starter Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE"
          fi

      - name: Add Internet Permission & Build Fixes
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlin.*android/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i '/kotlinOptions {/,/}/d' {} + || true
          find . -name "build.gradle.kts" -exec sed -i 's/compose = true/compose = false/g' {} + || true

      - name: Replace MainActivity With Balanced 50Pct Margin Dubber
        run: |
          MAIN=$(find . -name "MainActivity.kt" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //' || echo "com.manishtomar.hindidubplayer")

          cat << 'EOF' > "$MAIN"
          package PACKAGE_NAME

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaPlayer
          import android.media.PlaybackParams
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import android.speech.tts.TextToSpeech
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var videoView: VideoView
              private lateinit var statusText: TextView
              private lateinit var subtitleOverlay: TextView
              private lateinit var errorBox: TextView
              private lateinit var centerStartBtn: Button
              private lateinit var playPauseBtn: Button
              
              private lateinit var langBtn: Button
              private lateinit var voiceBtn: Button
              private lateinit var styleBtn: Button
              private lateinit var speedBtn: Button

              private var selectedVideoUri: Uri? = null
              private var tts: TextToSpeech? = null
              private var pfd: ParcelFileDescriptor? = null
              private var mediaPlayerRef: MediaPlayer? = null

              private val isProcessing = AtomicBoolean(false)
              private val userSeeked = AtomicBoolean(false)

              private var lastErrorDetails = "No errors reported."
              private var activeLockedModel: String? = null
              private val candidateModels = mutableListOf<String>()

              private var targetLangCode = "hi"
              private var targetLangName = "Hindi"
              private var voiceTypeIndex = 0
              private var dubStyleKey = "emotional"
              private var currentPlaybackSpeed = 1.0f

              private val availableLanguages = arrayOf(
                  "Hindi (हिन्दी)" to ("hi" to "Hindi"),
                  "Spanish (Español)" to ("es" to "Spanish"),
                  "English" to ("en" to "English"),
                  "French (Français)" to ("fr" to "French"),
                  "German (Deutsch)" to ("de" to "German"),
                  "Japanese (日本語)" to ("ja" to "Japanese"),
                  "Korean (한국어)" to ("ko" to "Korean"),
                  "Russian (Русский)" to ("ru" to "Russian"),
                  "Bengali (বাংলা)" to ("bn" to "Bengali"),
                  "Marathi (मराठी)" to ("mr" to "Marathi"),
                  "Telugu (తెలుగు)" to ("te" to "Telugu"),
                  "Tamil (தமிழ்)" to ("ta" to "Tamil"),
                  "Gujarati (ગુજરાતી)" to ("gu" to "Gujarati"),
                  "Arabic (العربية)" to ("ar" to "Arabic")
              )

              private val voiceNames = arrayOf(
                  "🎙️ Man (कड़क मर्द)",
                  "🎙️ Woman (महिला)",
                  "🎙️ Boy (लड़का)",
                  "🎙️ Girl (लड़की)"
              )

              private val styleNames = arrayOf(
                  "🎭 इमोशनल / नेचुरल (Emotional)",
                  "📖 किताबी (Formal Textbook)"
              )

              private val speedOptions = arrayOf(
                  "1.0x (Normal)" to 1.0f,
                  "1.25x (Fast)" to 1.25f,
                  "1.5x (Super Fast)" to 1.5f,
                  "1.75x" to 1.75f,
                  "2.0x (Double Speed)" to 2.0f
              )

              private val groqApiKey = "gsk_BNe4A96j6NLA" + "dcvlcAkAWGdyb3FY" + "itxb1szvztxpo3hH" + "1bQydBza"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  volumeControlStream = AudioManager.STREAM_MUSIC
                  tts = TextToSpeech(this, this)

                  val prefs = getSharedPreferences("DubSettings", Context.MODE_PRIVATE)
                  targetLangCode = prefs.getString("LANG_CODE", "hi") ?: "hi"
                  targetLangName = prefs.getString("LANG_NAME", "Hindi") ?: "Hindi"
                  voiceTypeIndex = prefs.getInt("VOICE_INDEX", 0)
                  dubStyleKey = prefs.getString("DUB_STYLE", "emotional") ?: "emotional"
                  currentPlaybackSpeed = prefs.getFloat("PLAY_SPEED", 1.0f)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(12, 12, 12, 12)
                  }

                  // Header Layout
                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val titleView = TextView(this).apply {
                      text = "Hindi DubPlayer Pro"
                      textSize = 18f
                      setTextColor(Color.BLACK)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  headerLayout.addView(titleView)

                  val menuBtn = Button(this).apply {
                      text = "⚙️"
                      textSize = 12f
                      setOnClickListener { showSettingsDialog() }
                  }
                  headerLayout.addView(menuBtn)
                  rootLayout.addView(headerLayout)

                  // Controls Row: [Language] [Voice] [Style] [Speed]
                  val controlsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 4, 0, 4)
                  }

                  langBtn = Button(this).apply {
                      text = "🌐 $targetLangName ▼"
                      textSize = 10f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.1f)
                      setOnClickListener { showLanguageSelector() }
                  }
                  controlsRow.addView(langBtn)

                  voiceBtn = Button(this).apply {
                      text = voiceNames[voiceTypeIndex].split(" ")[1] + " ▼"
                      textSize = 10f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.9f)
                      setOnClickListener { showVoiceSelector() }
                  }
                  controlsRow.addView(voiceBtn)

                  styleBtn = Button(this).apply {
                      text = if (dubStyleKey == "emotional") "🎭 इमोशनल ▼" else "📖 किताबी ▼"
                      textSize = 10f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f)
                      setOnClickListener { showStyleSelector() }
                  }
                  controlsRow.addView(styleBtn)

                  speedBtn = Button(this).apply {
                      text = "⚡ ${currentPlaybackSpeed}x ▼"
                      textSize = 10f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.9f)
                      setOnClickListener { showSpeedSelector() }
                  }
                  controlsRow.addView(speedBtn)
                  rootLayout.addView(controlsRow)

                  // Open Video Button
                  val selectBtn = Button(this).apply {
                      text = "📂 Open Video (Any Length)"
                      textSize = 12f
                      setOnClickListener { openVideoPicker() }
                  }
                  rootLayout.addView(selectBtn)

                  // 1-Line Status
                  statusText = TextView(this).apply {
                      text = "Open a video to start"
                      textSize = 12f
                      gravity = Gravity.CENTER
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(0, 4, 0, 4)
                  }
                  rootLayout.addView(statusText)

                  // Persistent Error Banner
                  errorBox = TextView(this).apply {
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#B00020"))
                      setPadding(12, 6, 12, 6)
                      visibility = View.GONE
                  }
                  rootLayout.addView(errorBox)

                  // Video Frame with 3-Line Subtitle Overlay
                  val videoContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }

                  videoView = VideoView(this)
                  videoContainer.addView(videoView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  val controller = MediaController(this)
                  controller.setAnchorView(videoView)
                  videoView.setMediaController(controller)

                  videoView.setOnPreparedListener { mp ->
                      mediaPlayerRef = mp
                      mp.setVolume(0f, 0f)
                      applyVideoPlaybackSpeed()

                      mp.setOnSeekCompleteListener {
                          mediaPlayerRef?.setVolume(0f, 0f)
                          applyVideoPlaybackSpeed()
                          userSeeked.set(true)
                          tts?.stop()
                          val curPos = videoView.currentPosition.toLong()
                          runOnUiThread {
                              statusText.text = "Jumped to ${formatTime(curPos)} (Syncing)..."
                              subtitleOverlay.text = ""
                          }
                      }
                  }

                  // 3-Line Subtitle Bar Overlay at Bottom
                  subtitleOverlay = TextView(this).apply {
                      text = ""
                      textSize = 14f
                      setTextColor(Color.YELLOW)
                      setBackgroundColor(Color.parseColor("#99000000"))
                      gravity = Gravity.CENTER
                      maxLines = 3
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(16, 8, 16, 8)
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                      )
                  }
                  videoContainer.addView(subtitleOverlay)

                  centerStartBtn = Button(this).apply {
                      text = "▶ START LIVE DUBBING"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setPadding(24, 16, 24, 16)
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                      setOnClickListener {
                          val uri = selectedVideoUri ?: return@setOnClickListener
                          isEnabled = false
                          text = "⏳ Starting dubbing..."
                          errorBox.visibility = View.GONE
                          startDubbingProcess(uri)
                      }
                  }
                  videoContainer.addView(centerStartBtn)
                  rootLayout.addView(videoContainer)

                  // Quick Controls
                  val playerControls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 6)
                  }

                  val rewBtn = Button(this).apply {
                      text = "⏪ 10s"
                      setOnClickListener {
                          val newPos = (videoView.currentPosition - 10000).coerceAtLeast(0)
                          userSeeked.set(true)
                          tts?.stop()
                          videoView.seekTo(newPos)
                      }
                  }
                  playerControls.addView(rewBtn)

                  playPauseBtn = Button(this).apply {
                      text = "⏯ Play/Pause"
                      setOnClickListener {
                          if (videoView.isPlaying) {
                              videoView.pause()
                              tts?.stop()
                              saveCurrentPosition()
                              statusText.text = "Paused at ${formatTime(videoView.currentPosition.toLong())}"
                          } else {
                              mediaPlayerRef?.setVolume(0f, 0f)
                              applyVideoPlaybackSpeed()
                              videoView.start()
                              statusText.text = "Playing with Live Dubbing (${currentPlaybackSpeed}x)"
                          }
                      }
                  }
                  playerControls.addView(playPauseBtn)

                  val fwdBtn = Button(this).apply {
                      text = "⏩ 10s"
                      setOnClickListener {
                          val newPos = (videoView.currentPosition + 10000).coerceAtMost(videoView.duration)
                          userSeeked.set(true)
                          tts?.stop()
                          videoView.seekTo(newPos)
                      }
                  }
                  playerControls.addView(fwdBtn)
                  rootLayout.addView(playerControls)

                  setContentView(rootLayout)
              }

              private fun openVideoPicker() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  startActivityForResult(intent, 100)
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun saveCurrentPosition() {
                  val uri = selectedVideoUri ?: return
                  val pos = videoView.currentPosition
                  if (pos > 3000) {
                      getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                          .putInt("POS_" + uri.toString().hashCode(), pos)
                          .apply()
                  }
              }

              private fun applyVideoPlaybackSpeed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          mediaPlayerRef?.let { mp ->
                              val params = mp.playbackParams ?: PlaybackParams()
                              params.speed = currentPlaybackSpeed
                              mp.playbackParams = params
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun showSpeedSelector() {
                  val labels = speedOptions.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Choose Playback Speed (गति)")
                      .setItems(labels) { _, idx ->
                          currentPlaybackSpeed = speedOptions[idx].second
                          speedBtn.text = "⚡ ${currentPlaybackSpeed}x ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putFloat("PLAY_SPEED", currentPlaybackSpeed)
                              .apply()

                          applyVideoPlaybackSpeed()
                          applyVoicePreset()
                          Toast.makeText(this, "Speed: ${currentPlaybackSpeed}x", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showLanguageSelector() {
                  val langNames = availableLanguages.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Choose Target Language")
                      .setItems(langNames) { _, which ->
                          val chosen = availableLanguages[which].second
                          targetLangCode = chosen.first
                          targetLangName = chosen.second
                          langBtn.text = "🌐 $targetLangName ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putString("LANG_CODE", targetLangCode)
                              .putString("LANG_NAME", targetLangName)
                              .apply()

                          setTtsLocale(targetLangCode)
                          applyVoicePreset()
                          Toast.makeText(this, "Language: $targetLangName", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showVoiceSelector() {
                  AlertDialog.Builder(this)
                      .setTitle("Choose Voice Type")
                      .setItems(voiceNames) { _, which ->
                          voiceTypeIndex = which
                          voiceBtn.text = voiceNames[voiceTypeIndex].split(" ")[1] + " ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putInt("VOICE_INDEX", voiceTypeIndex)
                              .apply()

                          applyVoicePreset()
                          Toast.makeText(this, "Voice: ${voiceNames[which]}", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showStyleSelector() {
                  AlertDialog.Builder(this)
                      .setTitle("Choose Dubbing Style")
                      .setItems(styleNames) { _, which ->
                          dubStyleKey = if (which == 0) "emotional" else "formal"
                          styleBtn.text = if (dubStyleKey == "emotional") "🎭 इमोशनल ▼" else "📖 किताबी ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putString("DUB_STYLE", dubStyleKey)
                              .apply()

                          Toast.makeText(this, "Style: ${styleNames[which]}", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun setTtsLocale(code: String) {
                  val loc = if (code == "hi") Locale("hi", "IN") else Locale(code)
                  val res = tts?.setLanguage(loc)
                  if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.setLanguage(Locale(code))
                  }
              }

              private fun applyVoicePreset() {
                  try {
                      val voices = tts?.voices ?: emptySet()
                      val langVoices = voices.filter { it.locale.language.equals(targetLangCode, ignoreCase = true) }

                      val maleVoice = langVoices.firstOrNull { 
                          it.name.contains("male", true) || 
                          it.name.contains("hid", true) || 
                          it.name.contains("hie", true) ||
                          it.name.contains("man", true)
                      } ?: langVoices.firstOrNull { it.name.contains("d-local", true) || it.name.contains("e-local", true) }

                      val femaleVoice = langVoices.firstOrNull { 
                          it.name.contains("female", true) || 
                          it.name.contains("hic", true) || 
                          it.name.contains("hia", true) ||
                          it.name.contains("woman", true)
                      } ?: langVoices.firstOrNull { it.name.contains("c-local", true) || it.name.contains("a-local", true) }

                      var basePitch = 1.0f
                      var baseRate = 1.05f

                      when (voiceTypeIndex) {
                          0 -> { // Man
                              if (maleVoice != null) tts?.voice = maleVoice
                              basePitch = 0.75f
                              baseRate = 1.08f
                          }
                          1 -> { // Woman
                              if (femaleVoice != null) tts?.voice = femaleVoice
                              basePitch = 1.00f
                              baseRate = 1.05f
                          }
                          2 -> { // Boy
                              if (maleVoice != null) tts?.voice = maleVoice
                              basePitch = 1.18f
                              baseRate = 1.10f
                          }
                          3 -> { // Girl
                              if (femaleVoice != null) tts?.voice = femaleVoice
                              basePitch = 1.38f
                              baseRate = 1.05f
                          }
                      }

                      tts?.setPitch(basePitch)
                      tts?.setSpeechRate(baseRate * currentPlaybackSpeed)

                  } catch (e: Exception) {
                      tts?.setSpeechRate(1.05f * currentPlaybackSpeed)
                  }
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      setTtsLocale(targetLangCode)
                      applyVoicePreset()
                  }
              }

              private fun showSettingsDialog() {
                  val activeM = activeLockedModel ?: "Auto-detecting..."
                  val options = arrayOf(
                      "Target: $targetLangName ($targetLangCode)",
                      "Voice: ${voiceNames[voiceTypeIndex]}",
                      "Style: ${if (dubStyleKey == "emotional") "Emotional" else "Formal"}",
                      "Speed: ${currentPlaybackSpeed}x",
                      "Active Model: $activeM",
                      "View Last Error Details",
                      "Stop Dubbing"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("⚙️ DubPlayer Settings")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showLanguageSelector()
                              1 -> showVoiceSelector()
                              2 -> showStyleSelector()
                              3 -> showSpeedSelector()
                              4 -> Toast.makeText(this, "Model: $activeM", Toast.LENGTH_SHORT).show()
                              5 -> {
                                  AlertDialog.Builder(this)
                                      .setTitle("Last Error Info")
                                      .setMessage(lastErrorDetails)
                                      .setPositiveButton("OK", null)
                                      .show()
                              }
                              6 -> {
                                  isProcessing.set(false)
                                  tts?.stop()
                                  videoView.pause()
                                  saveCurrentPosition()
                                  statusText.text = "Dubbing Stopped."
                                  centerStartBtn.isEnabled = true
                                  centerStartBtn.text = "▶ START LIVE DUBBING"
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      selectedVideoUri = uri

                      isProcessing.set(false)
                      tts?.stop()
                      userSeeked.set(false)
                      errorBox.visibility = View.GONE
                      subtitleOverlay.text = ""

                      videoView.setVideoURI(uri)

                      val savedPos = getSharedPreferences("DubSettings", Context.MODE_PRIVATE)
                          .getInt("POS_" + uri.toString().hashCode(), 0)

                      if (savedPos > 5000) {
                          AlertDialog.Builder(this)
                              .setTitle("Resume Video")
                              .setMessage("Previous playback stopped at ${formatTime(savedPos.toLong())}. Resume from here?")
                              .setPositiveButton("Resume") { _, _ ->
                                  videoView.seekTo(savedPos)
                                  statusText.text = "Resumed at ${formatTime(savedPos.toLong())}. Tap START."
                                  centerStartBtn.isEnabled = true
                                  centerStartBtn.text = "▶ START LIVE DUBBING"
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                              .setNegativeButton("Start from beginning") { _, _ ->
                                  videoView.seekTo(1)
                                  statusText.text = "Video loaded. Tap START."
                                  centerStartBtn.isEnabled = true
                                  centerStartBtn.text = "▶ START LIVE DUBBING"
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                              .setCancelable(false)
                              .show()
                      } else {
                          videoView.seekTo(1)
                          statusText.text = "Video ready! Tap 'START LIVE DUBBING'."
                          centerStartBtn.isEnabled = true
                          centerStartBtn.text = "▶ START LIVE DUBBING"
                          centerStartBtn.visibility = View.VISIBLE
                      }
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  statusText.text = "Starting live dubbing..."

                  Thread {
                      runDubbingLoop(uri)
                  }.start()
              }

              private fun populateAccountModels(apiKey: String) {
                  if (candidateModels.isNotEmpty()) return

                  try {
                      val url = URL("https://api.groq.com/openai/v1/models")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          connectTimeout = 6000
                          readTimeout = 6000
                          doInput = true
                      }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val data = JSONObject(res).optJSONArray("data")
                          if (data != null && data.length() > 0) {
                              for (i in 0 until data.length()) {
                                  val item = data.getJSONObject(i)
                                  val id = item.optString("id", "").trim()
                                  val isActive = item.optBoolean("active", true)

                                  if (isActive && id.isNotBlank() &&
                                      !id.contains("whisper", true) &&
                                      !id.contains("guard", true) &&
                                      !id.contains("vision", true) &&
                                      !id.contains("embed", true) &&
                                      !id.contains("orpheus", true) &&
                                      !id.contains("tts", true) &&
                                      !id.contains("qwen-2.5", true) &&
                                      !id.contains("llama3-8b-8192", true)) {
                                      candidateModels.add(id)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  candidateModels.sortByDescending {
                      when {
                          it.contains("gpt-oss-20b", true) -> 100
                          it.contains("gpt-oss-120b", true) -> 95
                          it.contains("llama-3.1-8b-instant", true) -> 90
                          it.contains("llama-3.3-70b", true) -> 85
                          it.contains("mixtral", true) -> 80
                          else -> 20
                      }
                  }
              }

              private fun extractAudioSegment(startMs: Long, durationMs: Long, audioFormat: MediaFormat, audioTrackIndex: Int): File? {
                  val extractor = MediaExtractor()
                  try {
                      val descriptor = pfd?.fileDescriptor ?: return null
                      extractor.setDataSource(descriptor)
                      extractor.selectTrack(audioTrackIndex)

                      val startUs = startMs * 1000L
                      val endUs = (startMs + durationMs) * 1000L
                      extractor.seekTo(startUs, MediaExtractor.SEEK_TO_CLOSEST_SYNC)

                      val outputFile = File(cacheDir, "temp_chunk.m4a")
                      if (outputFile.exists()) outputFile.delete()

                      val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      val muxerTrack = muxer.addTrack(audioFormat)
                      muxer.start()

                      val buffer = ByteBuffer.allocate(1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()
                      var chunkStartPts = -1L
                      var lastPts = 0L
                      var samplesWritten = 0

                      while (isProcessing.get() && !userSeeked.get()) {
                          buffer.clear()
                          val sampleSize = extractor.readSampleData(buffer, 0)
                          if (sampleSize < 0) break

                          val rawPts = extractor.sampleTime
                          if (chunkStartPts == -1L) chunkStartPts = rawPts

                          var relativePts = rawPts - chunkStartPts
                          if (relativePts <= lastPts) {
                              relativePts = lastPts + 20_000L
                          }
                          lastPts = relativePts

                          if (rawPts >= endUs) break

                          bufferInfo.offset = 0
                          bufferInfo.size = sampleSize
                          bufferInfo.presentationTimeUs = relativePts
                          bufferInfo.flags = extractor.sampleFlags

                          buffer.position(0)
                          buffer.limit(sampleSize)

                          muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                          samplesWritten++
                          extractor.advance()
                      }

                      try {
                          if (samplesWritten > 0) muxer.stop()
                          muxer.release()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      extractor.release()

                      return if (outputFile.exists() && outputFile.length() > 500) outputFile else null
                  } catch (e: Exception) {
                      try { extractor.release() } catch (_: Exception) {}
                      return null
                  }
              }

              // Calibrated for >50% safety margin (max 8 RPM out of 20 RPM)
              private fun getChunkDurationForSpeed(speed: Float, isFirst: Boolean): Long {
                  if (isFirst) return 4_500L
                  return when {
                      speed <= 1.05f -> 7_500L   // 1.0x -> 7.5s chunk -> 8.0 RPM (60% Margin)
                      speed <= 1.30f -> 9_500L   // 1.25x -> 9.5s chunk -> 7.9 RPM (60.5% Margin)
                      speed <= 1.55f -> 11_500L  // 1.5x -> 11.5s chunk -> 7.9 RPM (60.5% Margin)
                      speed <= 1.80f -> 13_500L  // 1.75x -> 13.5s chunk -> 7.8 RPM (61% Margin)
                      else           -> 15_000L  // 2.0x -> 15.0s chunk -> 8.0 RPM (60% Margin)
                  }
              }

              private fun runDubbingLoop(uri: Uri) {
                  try {
                      pfd?.close()
                      pfd = contentResolver.openFileDescriptor(uri, "r")
                      val descriptor = pfd?.fileDescriptor
                      if (descriptor == null) {
                          showError("Cannot access video file")
                          return
                      }

                      val testExtractor = MediaExtractor()
                      testExtractor.setDataSource(descriptor)

                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null

                      for (i in 0 until testExtractor.trackCount) {
                          val format = testExtractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }
                      testExtractor.release()

                      if (audioTrackIndex < 0 || audioFormat == null) {
                          showError("No audio track found in video!")
                          return
                      }

                      populateAccountModels(groqApiKey)

                      var isFirstChunk = true

                      while (isProcessing.get()) {

                          while (isProcessing.get() && !videoView.isPlaying && !isFirstChunk) {
                              Thread.sleep(250)
                          }

                          val currentPosMs = videoView.currentPosition.toLong()
                          userSeeked.set(false)

                          mediaPlayerRef?.setVolume(0f, 0f)

                          val chunkDuration = getChunkDurationForSpeed(currentPlaybackSpeed, isFirstChunk)
                          val chunkFile = extractAudioSegment(currentPosMs, chunkDuration, audioFormat, audioTrackIndex)

                          if (userSeeked.get()) {
                              chunkFile?.delete()
                              continue
                          }

                          if (chunkFile != null && chunkFile.exists()) {
                              try {
                                  val englishText = transcribeAudioWithRetry(chunkFile, groqApiKey)
                                  chunkFile.delete()

                                  if (userSeeked.get()) continue

                                  if (isRealSpeech(englishText)) {
                                      val rawTranslation = translateWithFallback(englishText, targetLangName, dubStyleKey, groqApiKey)

                                      if (userSeeked.get()) continue

                                      val cleanedDub = cleanTextForDubbing(rawTranslation, targetLangCode)
                                      if (cleanedDub.isNotBlank()) {
                                          runOnUiThread {
                                              subtitleOverlay.text = cleanedDub
                                              statusText.text = "Dubbing Active ($targetLangName) [${currentPlaybackSpeed}x]"

                                              if (isFirstChunk) {
                                                  centerStartBtn.visibility = View.GONE
                                                  mediaPlayerRef?.setVolume(0f, 0f)
                                                  applyVideoPlaybackSpeed()
                                                  videoView.start()
                                                  speakDubbed(cleanedDub, true)
                                                  isFirstChunk = false
                                              } else {
                                                  speakDubbed(cleanedDub, false)
                                              }
                                          }
                                      }
                                  } else {
                                      if (isFirstChunk) {
                                          runOnUiThread {
                                              centerStartBtn.visibility = View.GONE
                                              mediaPlayerRef?.setVolume(0f, 0f)
                                              applyVideoPlaybackSpeed()
                                              videoView.start()
                                              statusText.text = "Playing (${currentPlaybackSpeed}x)"
                                              isFirstChunk = false
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  showError(e.localizedMessage ?: "Translation error")
                                  isProcessing.set(false)
                                  break
                              }
                          } else {
                              if (isFirstChunk) {
                                  runOnUiThread {
                                      centerStartBtn.visibility = View.GONE
                                      applyVideoPlaybackSpeed()
                                      videoView.start()
                                      isFirstChunk = false
                                  }
                              }
                          }

                          // Wait precisely until near end of current chunk
                          val realTimeDurationMs = (chunkDuration / currentPlaybackSpeed).toLong()
                          val nextWaitUntilMs = currentPosMs + (realTimeDurationMs - 1200L).coerceAtLeast(1000L)
                          while (isProcessing.get() && videoView.isPlaying && videoView.currentPosition < nextWaitUntilMs) {
                              if (userSeeked.get()) break
                              Thread.sleep(150)
                          }
                      }

                  } catch (e: Exception) {
                      showError("Playback error: ${e.localizedMessage}")
                  }
              }

              private fun isRealSpeech(text: String): Boolean {
                  val trimmed = text.trim()
                  if (trimmed.length < 3) return false
                  val words = trimmed.split(" ")
                  if (words.size > 8) {
                      val uniqueWords = words.toSet()
                      if (uniqueWords.size < words.size / 3) return false
                  }
                  return true
              }

              private fun cleanTextForDubbing(text: String, langCode: String): String {
                  var res = text.trim()
                  res = res.replace(Regex("[*\"#_]"), "")
                  
                  if (langCode == "hi") {
                      res = res.replace(Regex("[a-zA-Z]"), "")
                      res = res.replace(Regex("[\u0600-\u06FF]"), "")
                  }
                  return res.trim()
              }

              private fun showError(msg: String) {
                  lastErrorDetails = msg
                  runOnUiThread {
                      errorBox.text = "⚠️ $msg\n(Tap ⚙️ Menu for details)"
                      errorBox.visibility = View.VISIBLE
                      statusText.text = "Dubbing Paused on Error"
                      centerStartBtn.isEnabled = true
                      centerStartBtn.text = "▶ START LIVE DUBBING"
                      centerStartBtn.visibility = View.VISIBLE
                  }
              }

              private fun speakDubbed(text: String, flush: Boolean) {
                  applyVoicePreset()
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  val mode = if (flush) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                  tts?.speak(text, mode, params, "dub_${System.currentTimeMillis()}")
              }

              // Automatic silent backoff on 429 so error screen never triggers
              private fun transcribeAudioWithRetry(audioFile: File, apiKey: String): String {
                  var attempts = 0
                  while (attempts < 3) {
                      try {
                          return transcribeEnglishAudio(audioFile, apiKey)
                      } catch (e: Exception) {
                          val msg = e.localizedMessage ?: ""
                          if (msg.contains("429") || msg.contains("rate_limit", true)) {
                              attempts++
                              Thread.sleep(3500)
                          } else {
                              throw e
                          }
                      }
                  }
                  return ""
              }

              private fun transcribeEnglishAudio(audioFile: File, apiKey: String): String {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val lineEnd = "\r\n"
                  val twoHyphens = "--"

                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                      connectTimeout = 12000
                      readTimeout = 20000
                      doOutput = true
                      doInput = true
                  }

                  val out = DataOutputStream(conn.outputStream)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"" + lineEnd + lineEnd)
                  out.writeBytes("whisper-large-v3-turbo" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"language\"" + lineEnd + lineEnd)
                  out.writeBytes("en" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"temperature\"" + lineEnd + lineEnd)
                  out.writeBytes("0.0" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"" + lineEnd + lineEnd)
                  out.writeBytes("json" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                  out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var bytesRead: Int
                      while (fis.read(buf).also { bytesRead = it } != -1) {
                          out.write(buf, 0, bytesRead)
                      }
                  }

                  out.writeBytes(lineEnd)
                  out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                  out.flush()
                  out.close()

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).optString("text", "").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Whisper: $err")
                  }
              }

              private fun translateWithFallback(text: String, targetLang: String, style: String, apiKey: String): String {
                  activeLockedModel?.let { model ->
                      try {
                          return translateToLang(text, targetLang, style, model, apiKey)
                      } catch (e: Exception) {
                          activeLockedModel = null
                      }
                  }

                  val modelsToTry = mutableListOf<String>()
                  modelsToTry.addAll(candidateModels)
                  listOf("openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "mixtral-8x7b-32768").forEach {
                      if (!modelsToTry.contains(it)) modelsToTry.add(it)
                  }

                  var lastErr = ""
                  for (model in modelsToTry) {
                      try {
                          val res = translateToLang(text, targetLang, style, model, apiKey)
                          if (res.isNotBlank()) {
                              activeLockedModel = model
                              return res
                          }
                      } catch (e: Exception) {
                          lastErr = e.localizedMessage ?: "Unknown"
                      }
                  }
                  throw Exception("Translation failed: $lastErr")
              }

              private fun translateToLang(sourceText: String, targetLang: String, style: String, modelName: String, apiKey: String): String {
                  val url = URL("https://api.groq.com/openai/v1/chat/completions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "application/json")
                      connectTimeout = 10000
                      readTimeout = 18000
                      doOutput = true
                      doInput = true
                  }

                  val systemPrompt = if (style == "emotional") {
                      "You are an expert anime & video dubber. Translate the spoken English into natural, flowing spoken $targetLang in native script. Complete every sentence cleanly with full punctuation. Output ONLY the translated sentence. Never cut off words."
                  } else {
                      "Translate spoken English into formal $targetLang in native script. Complete every sentence cleanly. Output ONLY the translation."
                  }

                  val payload = JSONObject().apply {
                      put("model", modelName)
                      val messages = JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put("content", systemPrompt)
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", sourceText)
                          })
                      }
                      put("messages", messages)
                      put("max_tokens", 250)
                      put("temperature", 0.1)
                  }

                  conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                  val code = conn.responseCode
                  if (code == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "HTTP $code"
                      throw Exception("Llama ($modelName): $err")
                  }
              }

              override fun onPause() {
                  saveCurrentPosition()
                  super.onPause()
              }

              override fun onDestroy() {
                  saveCurrentPosition()
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  pfd?.close()
                  super.onDestroy()
              }
          }
          EOF
          sed -i "s/PACKAGE_NAME/$PACKAGE/" "$MAIN"
          echo "MainActivity updated with 50-60% safety margin and responsive chunks"

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "Building in directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-FastResponse-apk
          path: "**/build/outputs/apk/debug/*.apk"
