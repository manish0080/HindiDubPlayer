              private fun toggleOverlayControls() {
                  if (playerControlsOverlay.visibility == View.VISIBLE) {
                      playerControlsOverlay.visibility = View.GONE
                      uiHandler.removeCallbacks(hideControlsRunnable)
                  } else {
                      showOverlayControls()
                  }
              }

              private fun showOverlayControls() {
                  playerControlsOverlay.visibility = View.VISIBLE
                  touchResetOverlayTimer()
              }

              private fun touchResetOverlayTimer() {
                  uiHandler.removeCallbacks(hideControlsRunnable)
                  uiHandler.postDelayed(hideControlsRunnable, 3500)
              }

              private fun togglePlayPause() {
                  if (videoView.isPlaying) {
                      videoView.pause()
                      tts?.stop()
                      isSpeechActive.set(false)
                      saveCurrentPosition()
                      statusBadge.text = "Paused"
                      onScreenPlayPauseBtn.text = "▶"
                      showCenterIndicator("⏸ Paused")
                      uiHandler.removeCallbacks(hideControlsRunnable)
                  } else {
                      mediaPlayerRef?.setVolume(0f, 0f)
                      applyVideoPlaybackSpeed()
                      videoView.start()
                      statusBadge.text = "Playing ($targetLangName)"
                      onScreenPlayPauseBtn.text = "⏸"
                      showCenterIndicator("▶ Playing")
                      touchResetOverlayTimer()
                  }
              }

              private fun enterFullscreen() {
                  isFullscreen = true
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }

                  rootFrame.setPadding(0, 0, 0, 0)
                  mainScrollView.visibility = View.GONE
                  videoContainer.layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.MATCH_PARENT
                  )

                  topBarBackBtn.visibility = View.VISIBLE
                  fullscreenSubtitleView.visibility = View.VISIBLE
                  onScreenFullscreenBtn.text = "⤓"

                  showOverlayControls()
              }

              private fun exitFullscreen() {
                  isFullscreen = false
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT

                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE

                  rootFrame.setPadding(0, systemStatusBarHeight, 0, 0)
                  mainScrollView.visibility = View.VISIBLE

                  val displayMetrics = resources.displayMetrics
                  val screenWidth = displayMetrics.widthPixels
                  val computedHeight = ((screenWidth * 9) / 16).coerceIn(dpToPx(210), dpToPx(260))

                  videoContainer.layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      computedHeight
                  )

                  topBarBackBtn.visibility = View.GONE
                  fullscreenSubtitleView.visibility = View.GONE
                  onScreenFullscreenBtn.text = "⛶"

                  showOverlayControls()
              }

              private fun toggleFullscreen() {
                  if (isFullscreen) exitFullscreen() else enterFullscreen()
              }

              override fun onBackPressed() {
                  if (isFullscreen) {
                      exitFullscreen()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      if (!isFullscreen) enterFullscreen()
                  } else if (newConfig.orientation == Configuration.ORIENTATION_PORTRAIT) {
                      if (isFullscreen) exitFullscreen()
                  }
              }

              private fun dpToPx(dp: Int): Int {
                  return (dp * resources.displayMetrics.density).toInt()
              }

