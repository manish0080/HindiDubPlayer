                          topMargin = dpToPx(6)
                          bottomMargin = dpToPx(14)
                      }
                      layoutParams = p
                  }
                  dialogView.addView(keyInput)

                  val recordStatus = TextView(this).apply {
                      text = if (customVoiceId.isNotBlank()) "Voice ID: $customVoiceId" else "Record a 10s clear voice sample"
                      setTextColor(Color.parseColor("#B0BEC5"))
                      textSize = 12f
                      val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = dpToPx(10)
                      }
                      layoutParams = p
                  }
                  dialogView.addView(recordStatus)

                  val recordBtn = Button(this).apply {
                      text = "🔴 Record Voice Sample (माइक)"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable(Color.parseColor("#D32F2F"), dpToPx(8).toFloat())
                      setOnClickListener {
                          if (!isRecordingSample) {
                              startSampleRecording(recordStatus, this)
                          } else {
                              stopSampleRecording(recordStatus, this)
                          }
                      }
                  }
                  dialogView.addView(recordBtn)

                  val dialog = AlertDialog.Builder(this)
                      .setTitle("🎙️ Instant Voice Cloning")
                      .setView(dialogView)
                      .setPositiveButton("Save & Use My Voice") { _, _ ->
                          val key = keyInput.text.toString().trim()
                          elevenApiKey = key
                          val prefs = getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                          prefs.putString("ELEVEN_API_KEY", elevenApiKey)

                          if (recordedSampleFile != null && recordedSampleFile!!.exists() && elevenApiKey.isNotBlank()) {
                              Toast.makeText(this, "Uploading voice sample...", Toast.LENGTH_SHORT).show()
