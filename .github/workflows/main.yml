              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  intent?.let { handleIncomingShareIntent(it) }
              }

              private fun handleIncomingShareIntent(intent: Intent) {
                  if (Intent.ACTION_SEND == intent.action && intent.type == "text/plain") {
                      val sharedText = intent.getStringExtra(Intent.EXTRA_TEXT) ?: ""
                      val extractedId = extractCleanYouTubeId(sharedText)
                      if (!extractedId.isNullOrEmpty()) {
                          loadYouTubeVideo(extractedId)
                      }
                  }
              }

              inner class YouTubeBridge {
                  @JavascriptInterface
                  fun onTimeUpdate(timeSec: Double) {
                      val timeMs = (timeSec * 1000.0).toLong()
                      if (Math.abs(timeSec - lastYoutubeSeekCheckSec) > 2.0) {
                          handleSeekTo(timeMs)
                      }
                      lastYoutubeSeekCheckSec = timeSec
                      currentYoutubeTimeMs.set(timeMs)
                  }

                  @JavascriptInterface
                  fun onStateChange(state: Int) {
                      runOnUiThread {
                          when (state) {
                              1 -> {
                                  isYoutubePlaying.set(true)
                                  statusBadge.text = "▶ YouTube Playing (Live Dubbing Active)"
                                  webViewPlayer.evaluateJavascript("if(player && player.unMute){ player.unMute(); player.setVolume(1); player.playVideo(); }", null)
                              }
                              2 -> {
                                  isYoutubePlaying.set(false)
                                  statusBadge.text = "⏸ YouTube Paused"
                                  tts?.stop()
                                  isSpeechActive.set(false)
                              }
                              3 -> statusBadge.text = "⏳ Buffering YouTube..."
                          }
                      }
                  }
              }

              private fun showYouTubeInputDialog() {
