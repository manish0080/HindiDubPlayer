              private fun applyAudioMuteState() {
                  if (isOriginalMuted) {
                      mediaPlayerRef?.setVolume(0f, 0f)
                  } else {
                      mediaPlayerRef?.setVolume(1.0f, 1.0f)
                  }
              }

              private fun applyVideoPlaybackSpeed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          mediaPlayerRef?.let { mp ->
                              val params = mp.playbackParams ?: PlaybackParams()
                              params.speed = currentPlaybackSpeed
                              mp.playbackParams = params
                          }
                      } catch (_: Exception) {}
                  }
              }

