              private fun runYouTubeLiveCaptionPipeline(videoId: String) {
                  populateAccountModels(groqApiKey)

                  val allSentences = mutableListOf<TimestampDubSegment>()

                  val instances = arrayOf("https://pipedapi.kavin.rocks", "https://api.invidious.io", "https://yt.artemislena.eu")
                  for (inst in instances) {
                      if (allSentences.isNotEmpty()) break
                      try {
                          val subUrl = "$inst/subtitles/$videoId"
                          val conn = (URL(subUrl).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 6000
                              readTimeout = 7000
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                          }
                          if (conn.responseCode == 200) {
                              val json = conn.inputStream.bufferedReader().use { it.readText() }
                              val arr = JSONArray(json)
                              var trackUrl = ""
                              for (i in 0 until arr.length()) {
                                  val item = arr.getJSONObject(i)
                                  val code = item.optString("code", "")
                                  if (code.startsWith("en") || code.startsWith("auto")) {
                                      trackUrl = item.optString("url", "")
                                      break
                                  }
                              }
                              if (trackUrl.isNotEmpty()) {
                                  val tConn = (URL(trackUrl).openConnection() as HttpURLConnection)
                                  val vtt = tConn.inputStream.bufferedReader().use { it.readText() }
                                  parseVttSubtitles(vtt, allSentences)
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  if (allSentences.isEmpty()) {
                      try {
                          val directUrl = "https://www.youtube.com/api/timedtext?v=$videoId&lang=en&fmt=json3"
                          val conn = (URL(directUrl).openConnection() as HttpURLConnection).apply {
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                              connectTimeout = 6000
                              readTimeout = 7000
                          }
                          if (conn.responseCode == 200) {
                              val res = conn.inputStream.bufferedReader().use { it.readText() }
                              parseJson3Subtitles(res, allSentences)
                          }
                      } catch (_: Exception) {}
                  }

                  if (allSentences.isEmpty()) {
                      runOnUiThread {
                          statusBadge.text = "⚠️ No captions found for this YouTube video."
                          originalContentView.text = "This YouTube video has no subtitles."
                          translatedContentView.text = "Try another YouTube link or use '📁 Local'."
                      }
                      return
                  }

                  runOnUiThread {
                      statusBadge.text = "Captions Loaded (${allSentences.size} lines). Live Dubbing Active!"
                  }

                  var currentIndex = 0
                  while (isProcessing.get() && currentIndex < allSentences.size) {
                      val batch = mutableListOf<TimestampDubSegment>()
                      while (batch.size < 5 && currentIndex < allSentences.size) {
                          batch.add(allSentences[currentIndex])
                          currentIndex++
                      }

                      val texts = batch.map { it.originalText }
                      val translatedObjs = batchTranslateDialoguesForYouTube(texts, targetLangName, dubStyleKey, groqApiKey)

                      for (k in batch.indices) {
                          val seg = batch[k]
                          val transObj = if (k < translatedObjs.size) translatedObjs[k] else ("" to "man")
                          val cleaned = cleanTextForDubbing(transObj.first, targetLangCode)
                          val speaker = transObj.second

                          if (cleaned.isNotBlank()) {
                              val newSeg = TimestampDubSegment(seg.startMs, seg.endMs, seg.originalText, cleaned, speaker)
                              sessionCacheMap[seg.startMs] = newSeg
                              timelineDubQueue.add(newSeg)
                          }
                      }

                      Thread.sleep(1000)
                  }
              }

              private fun parseVttSubtitles(vtt: String, outList: MutableList<TimestampDubSegment>) {
                  val lines = vtt.split("\n")
                  var startMs = -1L
                  var endMs = -1L
                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.contains("-->")) {
                          val parts = trimmed.split("-->")
                          if (parts.size == 2) {
                              startMs = parseTimestampToMs(parts[0].trim())
                              endMs = parseTimestampToMs(parts[1].trim())
                          }
                      } else if (startMs != -1L && endMs != -1L && trimmed.isNotEmpty() && !trimmed.matches(Regex("^[0-9]+$"))) {
                          val text = cleanHtmlEntities(trimmed)
                          if (isRealSpeech(text)) {
                              outList.add(TimestampDubSegment(startMs, endMs, text, ""))
                          }
                          startMs = -1L
                          endMs = -1L
                      }
                  }
              }

              private fun parseJson3Subtitles(jsonStr: String, outList: MutableList<TimestampDubSegment>) {
                  val root = JSONObject(jsonStr)
                  val events = root.optJSONArray("events") ?: return
                  for (i in 0 until events.length()) {
                      val ev = events.getJSONObject(i)
                      val startMs = ev.optLong("tStartMs", -1L)
                      val durMs = ev.optLong("dDurationMs", 0L)
                      val segs = ev.optJSONArray("segs")
                      if (startMs >= 0 && segs != null) {
                          val sb = StringBuilder()
                          for (j in 0 until segs.length()) {
                              sb.append(segs.getJSONObject(j).optString("utf8", ""))
                          }
                          val text = cleanHtmlEntities(sb.toString().replace("\n", " ").trim())
                          if (isRealSpeech(text)) {
                              outList.add(TimestampDubSegment(startMs, startMs + durMs, text, ""))
                          }
                      }
                  }
              }

              private fun parseTimestampToMs(stamp: String): Long {
                  val parts = stamp.split(":")
                  return try {
                      if (parts.size == 3) {
                          val h = parts[0].toLong()
                          val m = parts[1].toLong()
                          val sParts = parts[2].split(".")
                          val s = sParts[0].toLong()
                          val ms = if (sParts.size > 1) sParts[1].padEnd(3, '0').substring(0, 3).toLong() else 0L
                          (h * 3600 + m * 60 + s) * 1000 + ms
                      } else if (parts.size == 2) {
                          val m = parts[0].toLong()
                          val sParts = parts[1].split(".")
                          val s = sParts[0].toLong()
                          val ms = if (sParts.size > 1) sParts[1].padEnd(3, '0').substring(0, 3).toLong() else 0L
                          (m * 60 + s) * 1000 + ms
                      } else 0L
                  } catch (_: Exception) { 0L }
              }

              private fun batchTranslateDialoguesForYouTube(texts: List<String>, targetLang: String, style: String, apiKey: String): List<Pair<String, String>> {
                  if (texts.isEmpty()) return emptyList()
                  val jsonInput = JSONArray()
                  texts.forEach { jsonInput.put(it) }

                  val prompt = "Translate this JSON array of dialogue strings into expressive spoken $targetLang in native script. Also classify the speaker into: 'man', 'woman', 'boy', or 'girl'. Output ONLY a valid JSON array of objects: [{\"text\": \"अनुवाद\", \"speaker\": \"woman\"}]."

                  val model = activeLockedModel ?: "llama-3.1-8b-instant"
                  try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 8000
                          readTimeout = 15000
                          doOutput = true
                          doInput = true
                      }

                      val payload = JSONObject().apply {
                          put("model", model)
                          val messages = JSONArray().apply {
                              put(JSONObject().apply { put("role", "system"); put("content", prompt) })
                              put(JSONObject().apply { put("role", "user"); put("content", jsonInput.toString()) })
                          }
                          put("messages", messages)
                          put("temperature", 0.1)
                      }

                      conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val rawContent = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                          val cleanJson = if (rawContent.contains("[")) rawContent.substring(rawContent.indexOf("["), rawContent.lastIndexOf("]") + 1) else rawContent
                          val parsedArr = JSONArray(cleanJson)
                          val results = mutableListOf<Pair<String, String>>()
                          for (i in 0 until parsedArr.length()) {
                              val item = parsedArr.optJSONObject(i)
                              if (item != null) {
                                  results.add(item.optString("text", "") to item.optString("speaker", "man").lowercase())
                              } else {
                                  results.add(parsedArr.getString(i) to "man")
                              }
                          }
                          activeLockedModel = model
                          return results
                      }
                  } catch (_: Exception) {}

                  return texts.map { it to "man" }
              }

              private fun cleanHtmlEntities(text: String): String {
                  return text.replace("&#39;", "'")
                      .replace("&quot;", "\"")
                      .replace("&amp;", "&")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                      .replace("\n", " ")
                      .trim()
              }

