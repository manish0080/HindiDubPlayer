                  }
                  AlertDialog.Builder(this)
                      .setTitle("🔗 YouTube Live Dubbing")
                      .setMessage("Paste any YouTube Video or Shorts URL to live dub:")
                      .setView(input)
                      .setPositiveButton("Dub Now") { _, _ ->
                          val text = input.text.toString().trim()
                          val id = extractCleanYouTubeId(text)
                          if (!id.isNullOrEmpty()) {
                              loadYouTubeVideo(id)
                          } else {
                              Toast.makeText(this, "Invalid YouTube URL", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun extractCleanYouTubeId(rawUrl: String): String? {
                  val trimmed = rawUrl.trim()
                  val patterns = arrayOf(
                      "youtu\\.be\\/([a-zA-Z0-9_-]{11})",
                      "v=([a-zA-Z0-9_-]{11})",
                      "embed\\/([a-zA-Z0-9_-]{11})",
                      "shorts\\/([a-zA-Z0-9_-]{11})"
                  )
                  for (pat in patterns) {
                      val m = Pattern.compile(pat).matcher(trimmed)
                      if (m.find()) {
                          return m.group(1)
                      }
                  }
                  if (trimmed.length == 11 && trimmed.matches(Regex("^[a-zA-Z0-9_-]{11}$"))) {
                      return trimmed
                  }
                  return null
              }

