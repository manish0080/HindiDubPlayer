              private fun addVideoToHistory(uri: Uri) {
                  val name = getFileNameFromUri(uri)
                  val dateStr = SimpleDateFormat("dd MMM, hh:mm a", Locale.getDefault()).format(Date())
                  val prefs = getSharedPreferences("DubHistory", Context.MODE_PRIVATE)

                  val historyRaw = prefs.getString("HISTORY_ITEMS", "[]") ?: "[]"
                  val arr = JSONArray(historyRaw)

                  val newObj = JSONObject().apply {
                      put("uri", uri.toString())
                      put("name", name)
                      put("time", dateStr)
                  }

                  val newArr = JSONArray()
                  newArr.put(newObj)
                  for (i in 0 until arr.length()) {
                      val item = arr.getJSONObject(i)
                      if (item.optString("uri") != uri.toString()) {
                          newArr.put(item)
                      }
                      if (newArr.length() >= 30) break
                  }
                  prefs.edit().putString("HISTORY_ITEMS", newArr.toString()).apply()
              }

              private fun populateRealHistory() {
                  historyListContainer.removeAllViews()
                  val prefs = getSharedPreferences("DubHistory", Context.MODE_PRIVATE)
                  val historyRaw = prefs.getString("HISTORY_ITEMS", "[]") ?: "[]"
                  val arr = JSONArray(historyRaw)

                  if (arr.length() == 0) {
                      historyEmptyView.visibility = View.VISIBLE
                      historyListContainer.addView(historyEmptyView)
                  } else {
                      historyEmptyView.visibility = View.GONE
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          val uriStr = item.optString("uri")
                          val name = item.optString("name")
                          val time = item.optString("time")

                          val row = createHistoryItem(name, time) {
                              try {
                                  val uri = Uri.parse(uriStr)
                                  playSelectedUri(uri)
                              } catch (_: Exception) {
                                  Toast.makeText(this, "फ़ाइल नहीं मिल सकी", Toast.LENGTH_SHORT).show()
                              }
                          }
                          historyListContainer.addView(row)
                      }
                  }
              }

              private fun getFileNameFromUri(uri: Uri): String {
                  var name = "Video.mp4"
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIndex != -1 && cursor.moveToFirst()) {
                              name = cursor.getString(nameIndex) ?: "Video.mp4"
                          }
                      }
                  } catch (_: Exception) {}
                  return name
              }

              private fun showTargetLanguageDialog() {
                  val names = availableLanguages.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("अनुवाद भाषा चुनें (Target Language)")
                      .setItems(names) { _, which ->
                          val chosen = availableLanguages[which].second
                          targetLangCode = chosen.first
                          targetLangName = chosen.second
                          settingTargetLangVal.text = "$targetLangName ⌄"
                          homeSubTitleText.text = "$sourceLangName Video • $targetLangName Audio"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putString("LANG_CODE", targetLangCode)
                              .putString("LANG_NAME", targetLangName)
                              .apply()

                          tts?.setLanguage(Locale(targetLangCode, "IN"))
                          resolveStudioVoices()
                          timelineDubQueue.clear()
