              private fun startSeekBarUpdater() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (selectedVideoUri != null && videoView.isPlaying && !isUserTouchingSeekBar) {
                              val currentPos = videoView.currentPosition
