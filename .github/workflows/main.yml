              private fun purgeSessionTempFiles() {
                  try {
                      cacheDir.listFiles()?.forEach { file ->
                          if (file.name.startsWith("chunk_") || file.name.startsWith("session_dub_") || file.name.startsWith("dub_cache_")) {
                              file.delete()
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun handleSeekTo(targetPosMs: Long) {
                  isSeeking.set(true)
                  seekTargetMs.set(targetPosMs)
                  timelineDubQueue.clear()
                  currentlyPlayingSegment = null
                  tts?.stop()
                  isSpeechActive.set(false)
                  lastSpeechEndTimeMs = 0L
                  subtitleOverlay.text = ""

                  val cachedInRange = sessionCacheMap.values
                      .filter { it.startMs in (targetPosMs - 1000L)..(targetPosMs + 20000L) }
                      .sortedBy { it.startMs }

                  if (cachedInRange.isNotEmpty()) {
                      cachedInRange.forEach { seg ->
                          seg.isTriggered = false
                          timelineDubQueue.add(seg)
                      }
                      isSeeking.set(false)
                      mediaPlayerRef?.setVolume(0f, 0f)
                      applyVideoPlaybackSpeed()
                      videoView.start()
                      statusText.text = "⚡ Instant Cache Playback (${currentPlaybackSpeed}x)"
                  } else {
                      videoView.pause()
                      statusText.text = "⏳ Syncing Dubbing at ${formatTime(targetPosMs)}..."
                  }
              }

              private fun openVideoPicker() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  startActivityForResult(intent, 100)
              }

              private fun formatTime(ms: Long): String {
                  val totalSec = ms / 1000
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
              }

              private fun saveCurrentPosition() {
                  val uri = selectedVideoUri ?: return
                  val pos = videoView.currentPosition
                  if (pos > 3000) {
                      getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                          .putInt("POS_" + uri.toString().hashCode(), pos)
                          .apply()
                  }
              }

              // RATIO ADJUSTMENT: Video is set to 0.90x of selected speed to give audio headroom
              private fun applyVideoPlaybackSpeed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          mediaPlayerRef?.let { mp ->
                              val params = mp.playbackParams ?: PlaybackParams()
                              // Proportional slowdown: 0.90x gives 10-15% natural breathing buffer
                              val adjustedVideoSpeed = (currentPlaybackSpeed * 0.90f).coerceIn(0.5f, 2.5f)
                              params.speed = adjustedVideoSpeed
                              mp.playbackParams = params
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun showSpeedSelector() {
                  val labels = speedOptions.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Choose Playback Speed")
                      .setItems(labels) { _, idx ->
                          currentPlaybackSpeed = speedOptions[idx].second
                          speedBtn.text = "⚡ ${currentPlaybackSpeed}x ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putFloat("PLAY_SPEED", currentPlaybackSpeed)
                              .apply()

                          applyVideoPlaybackSpeed()
                          applyVoicePreset()
                          Toast.makeText(this, "Speed: ${currentPlaybackSpeed}x (Video: ${(currentPlaybackSpeed * 0.90f)}x, Voice: ${(1.12f * currentPlaybackSpeed)}x)", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showLanguageSelector() {
                  val langNames = availableLanguages.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Choose Target Language")
                      .setItems(langNames) { _, which ->
                          val chosen = availableLanguages[which].second
                          targetLangCode = chosen.first
                          targetLangName = chosen.second
                          langBtn.text = "🌐 $targetLangName ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putString("LANG_CODE", targetLangCode)
                              .putString("LANG_NAME", targetLangName)
                              .apply()

                          setTtsLocale(targetLangCode)
                          applyVoicePreset()
                          timelineDubQueue.clear()
                          sessionCacheMap.clear()

                          Toast.makeText(this, "Language: $targetLangName", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showVoiceSelector() {
                  AlertDialog.Builder(this)
                      .setTitle("Choose Voice Type")
                      .setItems(voiceNames) { _, which ->
                          voiceTypeIndex = which
                          voiceBtn.text = voiceNames[voiceTypeIndex].split(" ")[1] + " ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putInt("VOICE_INDEX", voiceTypeIndex)
                              .apply()

                          applyVoicePreset()
                          Toast.makeText(this, "Voice: ${voiceNames[which]}", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showStyleSelector() {
                  AlertDialog.Builder(this)
                      .setTitle("Choose Dubbing Style")
                      .setItems(styleNames) { _, which ->
                          dubStyleKey = if (which == 0) "emotional" else "formal"
                          styleBtn.text = if (dubStyleKey == "emotional") "🎭 इमोशनल ▼" else "📖 किताबी ▼"

                          getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                              .putString("DUB_STYLE", dubStyleKey)
                              .apply()

                          timelineDubQueue.clear()
                          sessionCacheMap.clear()

                          Toast.makeText(this, "Style: ${styleNames[which]}", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun setTtsLocale(code: String) {
                  val loc = if (code == "hi") Locale("hi", "IN") else Locale(code)
                  val res = tts?.setLanguage(loc)
                  if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.setLanguage(Locale(code))
                  }
              }

              // AUDIO SPEED: Set to 1.12x base rate so speech finishes slightly before video scene ends
              private fun applyVoicePreset() {
                  try {
                      val voices = tts?.voices ?: emptySet()
                      val langVoices = voices.filter { it.locale.language.equals(targetLangCode, ignoreCase = true) }

                      val maleVoice = langVoices.firstOrNull { 
                          it.name.contains("male", true) || 
                          it.name.contains("hid", true) || 
                          it.name.contains("hie", true) ||
                          it.name.contains("man", true)
                      } ?: langVoices.firstOrNull { it.name.contains("d-local", true) || it.name.contains("e-local", true) }

                      val femaleVoice = langVoices.firstOrNull { 
                          it.name.contains("female", true) || 
                          it.name.contains("hic", true) || 
                          it.name.contains("hia", true) ||
                          it.name.contains("woman", true)
                      } ?: langVoices.firstOrNull { it.name.contains("c-local", true) || it.name.contains("a-local", true) }

                      var basePitch = 1.0f
                      var baseRate = 1.12f // 1.12x base rate guarantees dialogue finishes cleanly

                      when (voiceTypeIndex) {
                          0 -> { // Man
                              if (maleVoice != null) tts?.voice = maleVoice
                              basePitch = 0.75f
                              baseRate = 1.14f
                          }
                          1 -> { // Woman
                              if (femaleVoice != null) tts?.voice = femaleVoice
                              basePitch = 1.00f
                              baseRate = 1.10f
                          }
                          2 -> { // Boy
                              if (maleVoice != null) tts?.voice = maleVoice
                              basePitch = 1.18f
                              baseRate = 1.15f
                          }
                          3 -> { // Girl
                              if (femaleVoice != null) tts?.voice = femaleVoice
                              basePitch = 1.38f
                              baseRate = 1.10f
                          }
                      }

                      tts?.setPitch(basePitch)
                      tts?.setSpeechRate(baseRate * currentPlaybackSpeed)

                  } catch (e: Exception) {
                      tts?.setSpeechRate(1.12f * currentPlaybackSpeed)
                  }
              }

              override fun onInit(initStatus: Int) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      setTtsLocale(targetLangCode)
                      applyVoicePreset()

                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) {
                              isSpeechActive.set(true)
                          }

                          override fun onDone(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()

                              // Clear subtitle 500ms after speech ends
                              uiHandler.postDelayed({
                                  if (!isSpeechActive.get()) {
                                      subtitleOverlay.text = ""
                                  }
                              }, 500)
                          }

                          override fun onError(utteranceId: String?) {
                              isSpeechActive.set(false)
                              lastSpeechEndTimeMs = System.currentTimeMillis()
                              uiHandler.post { subtitleOverlay.text = "" }
                          }
                      })
                  }
              }

              private fun showSettingsDialog() {
                  val activeCount = sessionCacheMap.size
                  val options = arrayOf(
                      "Target: $targetLangName ($targetLangCode)",
                      "Voice: ${voiceNames[voiceTypeIndex]}",
                      "Style: ${if (dubStyleKey == "emotional") "Emotional" else "Formal"}",
                      "Speed: ${currentPlaybackSpeed}x (Video: ${(currentPlaybackSpeed * 0.90f)}x, Voice: ${(1.12f * currentPlaybackSpeed)}x)",
                      "Status: Ratio Calibration Active (Zero Cut-Off)",
                      "Stop Dubbing"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("⚙️ DubPlayer Settings")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showLanguageSelector()
                              1 -> showVoiceSelector()
                              2 -> showStyleSelector()
                              3 -> showSpeedSelector()
                              4 -> Toast.makeText(this, "0.90x Video & 1.12x Audio creates a natural dialogue buffer", Toast.LENGTH_LONG).show()
                              5 -> {
                                  isProcessing.set(false)
                                  tts?.stop()
                                  isSpeechActive.set(false)
                                  subtitleOverlay.text = ""
                                  timelineDubQueue.clear()
                                  videoView.pause()
                                  saveCurrentPosition()
                                  statusText.text = "Dubbing Stopped."
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      selectedVideoUri = uri

                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}

                      isProcessing.set(false)
                      tts?.stop()
                      isSpeechActive.set(false)
                      seekTargetMs.set(-1L)
                      timelineDubQueue.clear()
                      sessionCacheMap.clear()
                      currentlyPlayingSegment = null
                      errorBox.visibility = View.GONE
                      subtitleOverlay.text = ""

                      videoView.setVideoURI(uri)

                      val savedPos = getSharedPreferences("DubSettings", Context.MODE_PRIVATE)
                          .getInt("POS_" + uri.toString().hashCode(), 0)

                      if (savedPos > 5000) {
                          AlertDialog.Builder(this)
                              .setTitle("Resume Video")
                              .setMessage("Previous playback stopped at ${formatTime(savedPos.toLong())}. Resume from here?")
                              .setPositiveButton("Resume") { _, _ ->
                                  videoView.seekTo(savedPos)
                                  statusText.text = "Resumed at ${formatTime(savedPos.toLong())}. Tap START."
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                              .setNegativeButton("Start from beginning") { _, _ ->
                                  videoView.seekTo(1)
                                  statusText.text = "Video loaded. Tap START."
                                  centerStartBtn.visibility = View.VISIBLE
                              }
                              .setCancelable(false)
                              .show()
                      } else {
                          videoView.seekTo(1)
                          statusText.text = "Video ready! Tap 'START LIVE DUBBING'."
                          centerStartBtn.visibility = View.VISIBLE
                      }
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  isSeeking.set(false)
                  isSpeechActive.set(false)
                  timelineDubQueue.clear()
                  currentlyPlayingSegment = null
                  statusText.text = "Pre-buffering live dialogue session..."

                  Thread {
                      runLookAheadProducer(uri)
                  }.start()
              }

              // SYNCHRONIZED TIMELINE CONSUMER: Guarantees Sentence 1 completes 100% + enforces 400ms pause!
              private fun startTimestampConsumerLoop() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (isProcessing.get() && videoView.isPlaying && !isSeeking.get()) {
                              val curPos = videoView.currentPosition.toLong()
                              val now = System.currentTimeMillis()

                              // Natural breathing gap between sentences (minimum 350ms, scaled with speed)
                              val naturalGapMs = (400L / currentPlaybackSpeed).toLong().coerceAtLeast(300L)

                              val isBusySpeaking = isSpeechActive.get() || (tts?.isSpeaking == true)

                              // Trigger next dialogue ONLY if current speech is 100% done AND natural gap has passed
                              if (!isBusySpeaking && (now - lastSpeechEndTimeMs >= naturalGapMs)) {
                                  for (segment in timelineDubQueue) {
                                      if (!segment.isTriggered && curPos >= segment.startMs - 200L) {
                                          if (curPos <= segment.endMs + 3500L) {
                                              segment.isTriggered = true
                                              currentlyPlayingSegment = segment
                                              
                                              subtitleOverlay.text = segment.translatedText
                                              statusText.text = "Dubbing Active ($targetLangName) [${currentPlaybackSpeed}x]"
                                              
                                              speakDubbed(segment.translatedText)
                                              break
                                          } else {
                                              segment.isTriggered = true // Passed segment
                                          }
                                      }
                                  }
                              }

                              timelineDubQueue.removeIf { it.isTriggered && curPos > it.endMs + 8000L }
                          }
                          uiHandler.postDelayed(this, 50)
                      }
                  }, 50)
              }

              private fun populateAccountModels(apiKey: String) {
                  if (candidateModels.isNotEmpty()) return

                  try {
                      val url = URL("https://api.groq.com/openai/v1/models")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          connectTimeout = 6000
                          readTimeout = 6000
                          doInput = true
                      }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val data = JSONObject(res).optJSONArray("data")
                          if (data != null && data.length() > 0) {
                              for (i in 0 until data.length()) {
                                  val item = data.getJSONObject(i)
                                  val id = item.optString("id", "").trim()
                                  val isActive = item.optBoolean("active", true)

                                  if (isActive && id.isNotBlank() &&
                                      !id.contains("whisper", true) &&
                                      !id.contains("guard", true) &&
                                      !id.contains("vision", true) &&
                                      !id.contains("embed", true) &&
                                      !id.contains("orpheus", true) &&
                                      !id.contains("tts", true) &&
                                      !id.contains("qwen-2.5", true) &&
                                      !id.contains("llama3-8b-8192", true)) {
                                      candidateModels.add(id)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  candidateModels.sortByDescending {
                      when {
                          it.contains("gpt-oss-20b", true) -> 100
                          it.contains("gpt-oss-120b", true) -> 95
                          it.contains("llama-3.1-8b-instant", true) -> 90
                          it.contains("llama-3.3-70b", true) -> 85
                          it.contains("mixtral", true) -> 80
                          else -> 20
                      }
                  }
              }

              private fun extractAudioSegment(startMs: Long, durationMs: Long, audioFormat: MediaFormat, audioTrackIndex: Int): File? {
                  val uri = selectedVideoUri ?: return null
                  val pfdItem = contentResolver.openFileDescriptor(uri, "r") ?: return null

                  pfdItem.use { fd ->
                      val extractor = MediaExtractor()
                      try {
                          extractor.setDataSource(fd.fileDescriptor)
                          extractor.selectTrack(audioTrackIndex)

                          val startUs = startMs * 1000L
                          val endUs = (startMs + durationMs) * 1000L

                          extractor.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC)

                          while (extractor.sampleTime < startUs && extractor.sampleTime >= 0) {
                              if (!extractor.advance()) break
                          }

                          val outputFile = File(cacheDir, "chunk_${System.currentTimeMillis()}.m4a")
                          if (outputFile.exists()) outputFile.delete()

                          val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                          val muxerTrack = muxer.addTrack(audioFormat)
                          muxer.start()

                          val buffer = ByteBuffer.allocate(1024 * 1024)
                          val bufferInfo = MediaCodec.BufferInfo()
                          var firstSampleTimeUs = -1L
                          var lastPts = 0L
                          var samplesWritten = 0

                          while (isProcessing.get() && seekTargetMs.get() < 0) {
                              buffer.clear()
                              val sampleSize = extractor.readSampleData(buffer, 0)
                              if (sampleSize < 0) break

                              val rawPts = extractor.sampleTime
                              if (rawPts >= endUs) break

                              if (firstSampleTimeUs == -1L) firstSampleTimeUs = rawPts

                              var relativePts = rawPts - firstSampleTimeUs
                              if (relativePts <= lastPts) {
                                  relativePts = lastPts + 10_000L
                              }
                              lastPts = relativePts

                              bufferInfo.offset = 0
                              bufferInfo.size = sampleSize
                              bufferInfo.presentationTimeUs = relativePts
                              bufferInfo.flags = if (samplesWritten == 0) {
                                  extractor.sampleFlags or MediaCodec.BUFFER_FLAG_KEY_FRAME
                              } else {
                                  extractor.sampleFlags
                              }

                              buffer.position(0)
                              buffer.limit(sampleSize)

                              muxer.writeSampleData(muxerTrack, buffer, bufferInfo)
                              samplesWritten++

                              if (!extractor.advance()) break
                          }

                          try {
                              if (samplesWritten > 0) muxer.stop()
                              muxer.release()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          extractor.release()

                          return if (outputFile.exists() && samplesWritten >= 5 && outputFile.length() > 500) {
                              outputFile
                          } else {
                              outputFile.delete()
                              null
                          }
                      } catch (e: Exception) {
                          try { extractor.release() } catch (_: Exception) {}
                          return null
                      }
                  }
              }

              private fun runLookAheadProducer(uri: Uri) {
                  val testPfd = contentResolver.openFileDescriptor(uri, "r")
                  val testExtractor = MediaExtractor()

                  var audioTrackIndex = -1
                  var audioFormat: MediaFormat? = null

                  testPfd?.use { fd ->
                      testExtractor.setDataSource(fd.fileDescriptor)
                      for (i in 0 until testExtractor.trackCount) {
                          val format = testExtractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("audio/")) {
                              audioTrackIndex = i
                              audioFormat = format
                              break
                          }
                      }
                      testExtractor.release()
                  }

                  if (audioTrackIndex < 0 || audioFormat == null) {
                      runOnUiThread { statusText.text = "No audio track found in video!" }
                      return
                  }

                  populateAccountModels(groqApiKey)

                  var nextProducerPosMs = videoView.currentPosition.toLong()
                  var lastGroqCallTime = 0L

                  while (isProcessing.get()) {
                      try {
                          val jumped = seekTargetMs.getAndSet(-1L)
                          if (jumped >= 0) {
                              nextProducerPosMs = jumped
                              timelineDubQueue.clear()
                              currentlyPlayingSegment = null
                          }

                          val currentVideoPos = videoView.currentPosition.toLong()

                          // Maintain 15-20s buffer
                          if (!isSeeking.get() && nextProducerPosMs - currentVideoPos > 18000L) {
                              Thread.sleep(300)
                              continue
                          }

                          val chunkDuration = 8_000L
                          val extractStart = nextProducerPosMs
                          val extractEnd = extractStart + chunkDuration

                          // 1. Session Cache Check
                          val cachedInWindow = sessionCacheMap.values
                              .filter { it.startMs in (extractStart - 1000L)..extractEnd }
                              .sortedBy { it.startMs }

                          if (cachedInWindow.isNotEmpty()) {
                              cachedInWindow.forEach { seg ->
                                  if (!timelineDubQueue.contains(seg)) {
                                      seg.isTriggered = false
                                      timelineDubQueue.add(seg)
                                  }
                              }

                              nextProducerPosMs = extractEnd

                              if (isSeeking.get() || !videoView.isPlaying) {
                                  runOnUiThread {
                                      isSeeking.set(false)
                                      mediaPlayerRef?.setVolume(0f, 0f)
                                      applyVideoPlaybackSpeed()
                                      videoView.start()
                                      statusText.text = "⚡ Instant Cache Loaded ($targetLangName)"
                                  }
                              }
                              continue
                          }

                          // 2. Safe rate limit throttle
                          val elapsed = System.currentTimeMillis() - lastGroqCallTime
                          if (elapsed < 3000L) {
                              Thread.sleep(3000L - elapsed)
                          }

                          val chunkFile = extractAudioSegment(extractStart, chunkDuration, audioFormat, audioTrackIndex)

                          if (seekTargetMs.get() >= 0) {
                              chunkFile?.delete()
                              continue
                          }

                          nextProducerPosMs = extractEnd

                          if (chunkFile != null && chunkFile.exists()) {
                              lastGroqCallTime = System.currentTimeMillis()

                              val rawSegments = transcribeVerboseSegments(chunkFile, groqApiKey)
                              chunkFile.delete()

                              if (seekTargetMs.get() >= 0) continue

                              if (rawSegments.isNotEmpty()) {
                                  val textsToTranslate = rawSegments.map { it.originalText }
                                  val translatedTexts = batchTranslateDialogues(textsToTranslate, targetLangName, dubStyleKey, groqApiKey)

                                  if (seekTargetMs.get() >= 0) continue

                                  for (i in rawSegments.indices) {
                                      val seg = rawSegments[i]
                                      val translated = if (i < translatedTexts.size) cleanTextForDubbing(translatedTexts[i], targetLangCode) else ""

                                      if (translated.isNotBlank()) {
                                          val absStart = extractStart + seg.startMs
                                          val absEnd = extractStart + seg.endMs
                                          val newSeg = TimestampDubSegment(absStart, absEnd, seg.originalText, translated)
                                          
                                          sessionCacheMap[absStart] = newSeg
                                          timelineDubQueue.add(newSeg)
                                      }
                                  }

                                  if (isSeeking.get() || !videoView.isPlaying) {
                                      runOnUiThread {
                                          isSeeking.set(false)
                                          mediaPlayerRef?.setVolume(0f, 0f)
                                          applyVideoPlaybackSpeed()
                                          videoView.start()
                                          statusText.text = "Dubbing Active ($targetLangName) [${currentPlaybackSpeed}x]"
                                      }
                                  }
                              } else {
                                  if (isSeeking.get() || !videoView.isPlaying) {
                                      runOnUiThread {
                                          isSeeking.set(false)
                                          mediaPlayerRef?.setVolume(0f, 0f)
                                          applyVideoPlaybackSpeed()
                                          videoView.start()
                                          statusText.text = "Playing (Music/Silence)"
                                      }
                                  }
                              }
                          } else {
                              if (isSeeking.get() || !videoView.isPlaying) {
                                  runOnUiThread {
                                      isSeeking.set(false)
                                      applyVideoPlaybackSpeed()
                                      videoView.start()
                                  }
                              }
                          }

                      } catch (e: Exception) {
                          Thread.sleep(1500)
                      }
                  }
              }

              private fun transcribeVerboseSegments(audioFile: File, apiKey: String): List<TimestampDubSegment> {
                  val boundary = "Boundary" + System.currentTimeMillis()
                  val lineEnd = "\r\n"
                  val twoHyphens = "--"

                  val url = URL("https://api.groq.com/openai/v1/audio/transcriptions")
                  val conn = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      setRequestProperty("Authorization", "Bearer $apiKey")
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                      connectTimeout = 12000
                      readTimeout = 25000
                      doOutput = true
                      doInput = true
                  }

                  val out = DataOutputStream(conn.outputStream)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"model\"" + lineEnd + lineEnd)
                  out.writeBytes("whisper-large-v3-turbo" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"response_format\"" + lineEnd + lineEnd)
                  out.writeBytes("verbose_json" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"temperature\"" + lineEnd + lineEnd)
                  out.writeBytes("0.0" + lineEnd)

                  out.writeBytes(twoHyphens + boundary + lineEnd)
                  out.writeBytes("Content-Disposition: form-data; name=\"file\"; filename=\"" + audioFile.name + "\"" + lineEnd)
                  out.writeBytes("Content-Type: audio/m4a" + lineEnd + lineEnd)

                  FileInputStream(audioFile).use { fis ->
                      val buf = ByteArray(4096)
                      var bytesRead: Int
                      while (fis.read(buf).also { bytesRead = it } != -1) {
                          out.write(buf, 0, bytesRead)
                      }
                  }

                  out.writeBytes(lineEnd)
                  out.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd)
                  out.flush()
                  out.close()

                  val segmentsList = mutableListOf<TimestampDubSegment>()

                  if (conn.responseCode == 200) {
                      val res = conn.inputStream.bufferedReader().use { it.readText() }
                      val root = JSONObject(res)
                      val jsonSegments = root.optJSONArray("segments")

                      if (jsonSegments != null && jsonSegments.length() > 0) {
                          for (i in 0 until jsonSegments.length()) {
                              val item = jsonSegments.getJSONObject(i)
                              val startSec = item.optDouble("start", 0.0)
                              val endSec = item.optDouble("end", 0.0)
                              val text = item.optString("text", "").trim()

                              if (isRealSpeech(text)) {
                                  val startMs = (startSec * 1000.0).toLong()
                                  val endMs = (endSec * 1000.0).toLong().coerceAtLeast(startMs + 1000L)
                                  segmentsList.add(TimestampDubSegment(startMs, endMs, text, ""))
                              }
                          }
                      }
                  }
                  return segmentsList
              }

              private fun batchTranslateDialogues(texts: List<String>, targetLang: String, style: String, apiKey: String): List<String> {
                  if (texts.isEmpty()) return emptyList()

                  if (texts.size == 1) {
                      val single = translateSingleText(texts[0], targetLang, style, apiKey)
                      return listOf(single)
                  }

                  val jsonInput = JSONArray()
                  texts.forEach { jsonInput.put(it) }

                  val prompt = if (style == "emotional") {
                      "You are an expert anime & movie dubber. Translate this JSON array of spoken dialogues into natural, emotional spoken $targetLang in native script. Output ONLY a valid JSON array of translated strings with the exact same count. Example: [\"अनुवाद 1\", \"अनुवाद 2\"]"
                  } else {
                      "Translate this JSON array of spoken dialogues into formal $targetLang in native script. Output ONLY a valid JSON array of translated strings. Example: [\"अनुवाद 1\", \"अनुवाद 2\"]"
                  }

                  val model = activeLockedModel ?: "llama-3.1-8b-instant"

                  try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $apiKey")
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 10000
                          readTimeout = 20000
                          doOutput = true
                          doInput = true
                      }

                      val payload = JSONObject().apply {
                          put("model", model)
                          val messages = JSONArray().apply {
                              put(JSONObject().apply {
                                  put("role", "system")
                                  put("content", prompt)
                              })
                              put(JSONObject().apply {
                                  put("role", "user")
                                  put("content", jsonInput.toString())
                              })
                          }
                          put("messages", messages)
                          put("temperature", 0.1)
                      }

                      conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                      if (conn.responseCode == 200) {
                          val res = conn.inputStream.bufferedReader().use { it.readText() }
                          val rawContent = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()

                          val cleanJson = if (rawContent.contains("[")) {
                              rawContent.substring(rawContent.indexOf("["), rawContent.lastIndexOf("]") + 1)
                          } else rawContent

                          val parsedArr = JSONArray(cleanJson)
                          val results = mutableListOf<String>()
                          for (i in 0 until parsedArr.length()) {
                              results.add(parsedArr.getString(i))
                          }
                          activeLockedModel = model
                          return results
                      }
                  } catch (_: Exception) {}

                  return texts.map { translateSingleText(it, targetLang, style, apiKey) }
              }

              private fun translateSingleText(sourceText: String, targetLang: String, style: String, apiKey: String): String {
                  val modelsToTry = mutableListOf<String>()
                  activeLockedModel?.let { modelsToTry.add(it) }
                  modelsToTry.addAll(candidateModels)
                  listOf("openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "mixtral-8x7b-32768").forEach {
                      if (!modelsToTry.contains(it)) modelsToTry.add(it)
                  }

                  val systemPrompt = if (style == "emotional") {
                      "Translate spoken dialogue into natural, emotional spoken $targetLang in native script. Complete sentence cleanly. Output ONLY translation."
                  } else {
                      "Translate spoken dialogue into formal $targetLang in native script. Complete cleanly. Output ONLY translation."
                  }

                  for (model in modelsToTry) {
                      try {
                          val url = URL("https://api.groq.com/openai/v1/chat/completions")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Authorization", "Bearer $apiKey")
                              setRequestProperty("Content-Type", "application/json")
                              connectTimeout = 8000
                              readTimeout = 15000
                              doOutput = true
                              doInput = true
                          }

                          val payload = JSONObject().apply {
                              put("model", model)
                              val messages = JSONArray().apply {
                                  put(JSONObject().apply {
                                      put("role", "system")
                                      put("content", systemPrompt)
                                  })
                                  put(JSONObject().apply {
                                      put("role", "user")
                                      put("content", sourceText)
                                  })
                              }
                              put("messages", messages)
                              put("max_tokens", 250)
                              put("temperature", 0.1)
                          }

                          conn.outputStream.use { it.write(payload.toString().toByteArray()) }

                          if (conn.responseCode == 200) {
                              val res = conn.inputStream.bufferedReader().use { it.readText() }
                              val output = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                              if (output.isNotBlank()) {
                                  activeLockedModel = model
                                  return output
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return ""
              }

              private fun isRealSpeech(text: String): Boolean {
                  val trimmed = text.trim()
                  if (trimmed.length < 3) return false
                  val lower = trimmed.lowercase()

                  if (lower.contains("subtitles by") || lower.contains("amara.org") || lower.contains("thank you for watching")) {
                      return false
                  }
                  if (trimmed.startsWith("[") && trimmed.endsWith("]")) return false
                  if (trimmed.startsWith("(") && trimmed.endsWith(")")) return false

                  val words = trimmed.split(" ")
                  if (words.size > 8) {
                      val uniqueWords = words.toSet()
                      if (uniqueWords.size < words.size / 3) return false
                  }
                  return true
              }

              private fun cleanTextForDubbing(text: String, langCode: String): String {
                  var res = text.trim()
                  res = res.replace(Regex("[*\"#_]"), "")
                  
                  if (langCode == "hi") {
                      res = res.replace(Regex("[a-zA-Z]"), "")
                      res = res.replace(Regex("[\u0600-\u06FF]"), "")
                  }
                  return res.trim()
              }

              private fun speakDubbed(text: String) {
                  applyVoicePreset()
                  val params = Bundle().apply {
                      putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC)
                  }
                  isSpeechActive.set(true)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "dub_${System.currentTimeMillis()}")
              }

              override fun onPause() {
                  saveCurrentPosition()
                  super.onPause()
              }

              override fun onDestroy() {
                  saveCurrentPosition()
                  isProcessing.set(false)
                  tts?.stop()
                  tts?.shutdown()
                  timelineDubQueue.clear()
                  sessionCacheMap.clear()
                  purgeSessionTempFiles()
                  super.onDestroy()
              }
          }
