              private fun handleSeekTo(targetPosMs: Long) {
                  isSeeking.set(true)
                  seekTargetMs.set(targetPosMs)
                  timelineDubQueue.clear()
                  currentlyPlayingSegment = null
                  tts?.stop()
                  isSpeechActive.set(false)
                  lastSpeechEndTimeMs = 0L

                  fullscreenSubtitleView.text = ""
                  originalContentView.text = "Syncing..."
                  translatedContentView.text = "Syncing..."
                  speakerTagBadge.visibility = View.GONE

                  val cachedInRange = sessionCacheMap.values.filter { it.startMs in (targetPosMs - 1000L)..(targetPosMs + 20000L) }.sortedBy { it.startMs }
                  if (cachedInRange.isNotEmpty()) {
                      cachedInRange.forEach { seg ->
                          seg.isTriggered = false
                          timelineDubQueue.add(seg)
                      }
                      isSeeking.set(false)
                      if (!isYoutubeMode) {
                          mediaPlayerRef?.setVolume(0f, 0f)
                          applyVideoPlaybackSpeed()
                          videoView.start()
                      }
                      statusBadge.text = "⚡ Instant Cache Playback"
                  } else {
                      if (!isYoutubeMode) videoView.pause()
                      statusBadge.text = "⏳ Syncing Dubbing..."
                  }
              }

