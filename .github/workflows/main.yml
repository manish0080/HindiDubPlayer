              private fun setupGestureHandling() {
                  gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          toggleControlsVisibility()
                          return true
                      }

                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          togglePlayPause()
                          fadeInControls()
                          return true
                      }

                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float): Boolean {
                          if (e1 != null && Math.abs(distanceX) > Math.abs(distanceY)) {
                              val seekDelta = (-distanceX * 250).toLong()
                              val cur = playerVideoView.currentPosition.toLong()
                              val target = (cur + seekDelta).coerceIn(0L, playerVideoView.duration.toLong())

                              gestureFeedbackText.visibility = View.VISIBLE
                              gestureFeedbackText.text = if (seekDelta > 0) "▶▶ +${Math.abs(seekDelta)/1000}s (${formatTime(target)})" else "◀◀ -${Math.abs(seekDelta)/1000}s (${formatTime(target)})"
                              uiHandler.removeCallbacksAndMessages(gestureFeedbackText)
                              uiHandler.postDelayed({ gestureFeedbackText.visibility = View.GONE }, 700)

                              playerVideoView.seekTo(target.toInt())
                              handleSeekTo(target)
                              fadeInControls()
                              return true
                          }
                          return false
                      }
                  })

                  playerContainer.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      true
                  }
              }

              private fun toggleControlsVisibility() {
                  if (overlayControlsLayout.visibility == View.VISIBLE) fadeOutControls() else fadeInControls()
              }

              private fun fadeInControls() {
                  hideControlsHandler.removeCallbacks(hideControlsRunnable)
                  overlayControlsLayout.visibility = View.VISIBLE
                  hideControlsHandler.postDelayed(hideControlsRunnable, 3500)
              }

              private fun fadeOutControls() {
                  hideControlsHandler.removeCallbacks(hideControlsRunnable)
                  overlayControlsLayout.visibility = View.GONE
              }

              private fun togglePlayPause() {
                  if (playerVideoView.isPlaying) {
                      pausePlaybackAndDubbing()
                  } else {
                      isProcessing.set(true)
                      applyAudioMuteState()
                      applyVideoPlaybackSpeed()
                      playerVideoView.start()
                      playerPlayPauseCenterBtn.text = "⏸"
                      selectedVideoUri?.let { uri ->
                          Thread { runLookAheadProducer(uri) }.start()
                      }
                  }
              }

              private fun cyclePlaybackSpeed() {
                  currentPlaybackSpeed = when (currentPlaybackSpeed) {
                      1.0f -> 1.25f
                      1.25f -> 1.5f
                      1.5f -> 2.0f
                      else -> 1.0f
                  }
                  speedToggleBtn.text = "${currentPlaybackSpeed}x"
                  applyVideoPlaybackSpeed()
                  Toast.makeText(this, "${currentPlaybackSpeed}x Speed", Toast.LENGTH_SHORT).show()
              }

              private fun applyAudioMuteState() {
                  val targetVol = if (isSpeechActive.get()) 0.08f else originalVolumeLevel
                  mediaPlayerRef?.setVolume(targetVol, targetVol)
              }

              private fun applyVideoPlaybackSpeed() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          mediaPlayerRef?.let { mp ->
                              val p = mp.playbackParams ?: PlaybackParams()
                              p.speed = currentPlaybackSpeed
                              mp.playbackParams = p
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun toggleFullscreen() {
                  isFullscreen = !isFullscreen
                  if (isFullscreen) {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                      )
                      scriptFeedScroll.visibility = View.GONE
                      playerContainer.layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT)
                  } else {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                      scriptFeedScroll.visibility = View.VISIBLE
                      playerContainer.layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dpToPx(240))
                  }
                  fadeInControls()
              }

              private fun openVideoPicker() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  startActivityForResult(intent, 100)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}
                      playSelectedUri(uri, 0)
                  }
              }

              private fun playSelectedUri(uri: Uri, startPosMs: Int = 0) {
                  selectedVideoUri = uri
                  playerVideoView.setVideoURI(uri)
                  showScreen(2)
                  startDubbingProcess(uri)
                  playerVideoView.setOnPreparedListener { mp ->
                      mediaPlayerRef = mp
                      applyAudioMuteState()
                      applyVideoPlaybackSpeed()
                      playerSeekBar.max = playerVideoView.duration
                      playerTimeTotal.text = formatTime(playerVideoView.duration.toLong())
                      if (startPosMs > 0) playerVideoView.seekTo(startPosMs)
                      playerVideoView.start()
                      playerPlayPauseCenterBtn.text = "⏸"
                      fadeInControls()
                  }
              }

              private fun startDubbingProcess(uri: Uri) {
                  isProcessing.set(true)
                  isSeeking.set(false)
                  isSpeechActive.set(false)
                  transcriptLines.clear()
                  scriptFeedContainer.removeAllViews()
                  activeLineIndex = -1
                  Thread { runLookAheadProducer(uri) }.start()
              }

              private fun setupSeekBarListeners() {
                  playerSeekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          val pos = sb?.progress ?: 0
                          playerVideoView.seekTo(pos)
                          handleSeekTo(pos.toLong())
                      }
                      override fun onProgressChanged(sb: SeekBar?, prog: Int, fromUser: Boolean) {
                          if (fromUser) playerTimeCurrent.text = formatTime(prog.toLong())
                      }
                  })
              }

              private fun handleSeekTo(targetPosMs: Long) {
                  isSeeking.set(true)
                  seekTargetMs.set(targetPosMs)
                  tts?.stop()
                  isSpeechActive.set(false)
                  applyAudioMuteState()
                  isSeeking.set(false)
              }

              // Precise Progress Watcher (Runs every 30ms for zero delay)
              private fun startPlaybackProgressWatcher() {
                  uiHandler.postDelayed(object : Runnable {
                      override fun run() {
                          if (selectedVideoUri != null && playerVideoView.isPlaying) {
                              val curPos = playerVideoView.currentPosition.toLong()
                              playerSeekBar.progress = curPos.toInt()
                              playerTimeCurrent.text = formatTime(curPos)

                              if (isProcessing.get() && !isSeeking.get()) {
                                  for (i in transcriptLines.indices) {
                                      val line = transcriptLines[i]
                                      if (curPos in line.startMs..line.endMs) {
                                          if (activeLineIndex != i) {
                                              updateHighlightedTranscript(i)
                                              activeLineIndex = i
                                              if (!line.isSpoken && !isSubtitleOnlyMode) {
                                                  line.isSpoken = true
                                                  speakDubbed(line.translatedText, line.speakerType, line.endMs - line.startMs)
                                              }
                                          }
                                          break
                                      }
                                  }
                              }
                          }
                          uiHandler.postDelayed(this, 30)
                      }
                  }, 30)
              }

              private fun updateHighlightedTranscript(activeIndex: Int) {
                  for (i in transcriptLines.indices) {
                      val item = transcriptLines[i]
                      val isCurrent = (i == activeIndex)

                      item.hindiView?.apply {
                          if (isCurrent) {
                              setTextColor(Color.parseColor("#111827"))
                              textSize = 16f
                              setTypeface(null, Typeface.BOLD)
                          } else {
                              setTextColor(Color.parseColor("#9CA3AF"))
                              textSize = 13f
                              setTypeface(null, Typeface.NORMAL)
                          }
                      }
                      item.englishView?.apply {
                          setTextColor(if (isCurrent) Color.parseColor("#4B5563") else Color.parseColor("#D1D5DB"))
                      }
                  }

                  transcriptLines.getOrNull(activeIndex)?.hindiView?.let { targetView ->
                      scriptFeedScroll.smoothScrollTo(0, targetView.top - dpToPx(80))
                  }
              }

