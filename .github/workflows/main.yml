              private fun addVideoToHistory(uri: Uri) {
                  val name = getFileNameFromUri(uri)
                  val dateStr = SimpleDateFormat("dd MMM, hh:mm a", Locale.getDefault()).format(Date())
                  val prefs = getSharedPreferences("DubHistory", Context.MODE_PRIVATE)

                  val historyRaw = prefs.getString("HISTORY_ITEMS", "[]") ?: "[]"
                  val arr = JSONArray(historyRaw)

                  val newObj = JSONObject().apply {
                      put("uri", uri.toString())
                      put("name", name)
                      put("time", dateStr)
                  }

                  val newArr = JSONArray()
                  newArr.put(newObj)
                  for (i in 0 until arr.length()) {
                      val item = arr.getJSONObject(i)
                      if (item.optString("uri") != uri.toString()) {
                          newArr.put(item)
                      }
                      if (newArr.length() >= 30) break
                  }
                  prefs.edit().putString("HISTORY_ITEMS", newArr.toString()).apply()
              }

              private fun populateRealHistory() {
                  historyListContainer.removeAllViews()
                  val prefs = getSharedPreferences("DubHistory", Context.MODE_PRIVATE)
                  val historyRaw = prefs.getString("HISTORY_ITEMS", "[]") ?: "[]"
                  val arr = JSONArray(historyRaw)

                  if (arr.length() == 0) {
                      historyEmptyView.visibility = View.VISIBLE
                      historyListContainer.addView(historyEmptyView)
                  } else {
                      historyEmptyView.visibility = View.GONE
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          val uriStr = item.optString("uri")
                          val name = item.optString("name")
                          val time = item.optString("time")

                          val row = createHistoryItem(name, time) {
                              try {
                                  val uri = Uri.parse(uriStr)
                                  handleVideoSelectionWithResumeCheck(uri)
                              } catch (e: Exception) {
                                  showDebugError("History Play Exception: ${e.message}")
                                  Toast.makeText(this, "फ़ाइल नहीं मिल सकी", Toast.LENGTH_SHORT).show()
                              }
                          }
                          historyListContainer.addView(row)
                      }
                  }
              }

              private fun getFileNameFromUri(uri: Uri): String {
                  var name = "Video.mp4"
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIndex != -1 && cursor.moveToFirst()) {
                              name = cursor.getString(nameIndex) ?: "Video.mp4"
                          }
                      }
                  } catch (_: Exception) {}
                  return name
              }

              private fun handleVideoSelectionWithResumeCheck(uri: Uri) {
                  val prefs = getSharedPreferences("DubSettings", Context.MODE_PRIVATE)
                  val posKey = "POS_" + uri.toString().hashCode()
                  val savedPos = prefs.getInt(posKey, 0)

                  if (savedPos > 5000) {
                      AlertDialog.Builder(this)
                          .setTitle("Resume Video")
                          .setMessage("पिछला प्लेबैक ${formatTime(savedPos.toLong())} पर रुका था। क्या आप यहीं से रिज्यूम करना चाहते हैं?")
                          .setPositiveButton("Resume") { _, _ ->
                              playSelectedUri(uri, savedPos)
                          }
                          .setNegativeButton("Start from beginning") { _, _ ->
                              playSelectedUri(uri, 0)
                          }
                          .setCancelable(true)
                          .show()
                  } else {
                      playSelectedUri(uri, 0)
                  }
              }

              private fun playSelectedUri(uri: Uri, startPosMs: Int = 0) {
                  selectedVideoUri = uri
                  addVideoToHistory(uri)
                  playerVideoView.setVideoURI(uri)
                  showScreen(2)
                  startDubbingProcess(uri)
                  playerVideoView.setOnPreparedListener { mp ->
                      mediaPlayerRef = mp
                      applyAudioMuteState()
                      applyVideoPlaybackSpeed()
                      playerSeekBar.max = playerVideoView.duration
                      playerTimeTotal.text = formatTime(playerVideoView.duration.toLong())
                      if (startPosMs > 0) {
                          playerVideoView.seekTo(startPosMs)
                      }
                      playerVideoView.start()
                      playerPlayPauseBtn.text = "⏸"
                  }
              }

              private fun saveCurrentPosition() {
                  val uri = selectedVideoUri ?: return
                  val pos = playerVideoView.currentPosition
                  if (pos > 3000) {
                      getSharedPreferences("DubSettings", Context.MODE_PRIVATE).edit()
                          .putInt("POS_" + uri.toString().hashCode(), pos)
                          .apply()
                  }
              }

