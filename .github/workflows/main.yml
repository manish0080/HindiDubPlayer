name: Build HindiDubPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Starter Project
        run: |
          if [ -f "HindiDubPlayer-starter.zip" ]; then
            unzip -q "HindiDubPlayer-starter.zip"
          elif [ -f "Hindi DubPlayer-starter.zip" ]; then
            unzip -q "Hindi DubPlayer-starter.zip"
          fi
          ls -la

      - name: Build Debug APK
        run: |
          TARGET_DIR=$(find . -maxdepth 1 -type d -name "*Hindi*DubPlayer*" ! -name ".*" | head -1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiDubPlayer-starter-debug
          path: "**/build/outputs/apk/debug/*.apk"
